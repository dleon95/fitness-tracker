// ── HISTORY ────────────────────────────────────────
function renderProgressCharts() {
  // Get all exercises that have been logged with weight
  var exerciseHistory = {};
  ST.workoutLogs.forEach(function(log){
    (log.exercises||[]).forEach(function(ex){
      var maxW = Math.max(...(ex.sets||[]).map(s=>parseFloat(s.weight)||0));
      if(maxW > 0) {
        if(!exerciseHistory[ex.name]) exerciseHistory[ex.name] = [];
        exerciseHistory[ex.name].push({date:log.date, weight:maxW});
      }
    });
  });
  // Sort each exercise history by date
  Object.keys(exerciseHistory).forEach(function(name){
    exerciseHistory[name].sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  });
  var exercises = Object.keys(exerciseHistory).filter(function(n){return exerciseHistory[n].length>=2;});
  if(exercises.length===0) return `<div class="empty"><div class="empty-icon">📈</div><div>Log at least 2 sessions for an exercise to see progress</div></div>`;

  var sel = ST.prChartEx || exercises[0];
  if(!exerciseHistory[sel]) sel = exercises[0];
  var data = exerciseHistory[sel];
  var maxW = Math.max(...data.map(d=>d.weight));
  var minW = Math.min(...data.map(d=>d.weight));
  var range = maxW - minW || 10;
  var chartH = 140, chartW = 300, pad = 28;
  var pts = data.map(function(d,i){
    var x = pad + (i/(data.length-1||1))*(chartW-pad*2);
    var y = chartH - pad - ((d.weight-minW)/range)*(chartH-pad*2);
    return {x,y,d};
  });
  var pathD = pts.map(function(p,i){return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" ");

  return `
  <div class="card" style="padding:12px 14px">
    <!-- Exercise selector pills -->
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${exercises.map(function(n){
        var active = n===sel;
        return `<button data-prchartex="${n}" style="padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-b);border:1px solid ${active?"var(--accent)":"var(--border)"};background:${active?"rgba(79,142,247,.15)":"var(--bg3)"};color:${active?"var(--accent)":"var(--muted)"}">${n}</button>`;
      }).join("")}
    </div>

    <!-- Chart -->
    <div style="font-weight:700;font-size:14px;margin-bottom:4px">${sel}</div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${data.length} sessions · PR: ${maxW} lbs · ${data[0].date.slice(5)} → ${data[data.length-1].date.slice(5)}</div>
    <svg viewBox="0 0 ${chartW} ${chartH}" style="width:100%;overflow:visible">
      <!-- Grid lines -->
      ${[0,0.25,0.5,0.75,1].map(function(t){
        var y = chartH-pad-(t*(chartH-pad*2));
        var w = Math.round(minW+t*range);
        return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${chartW-pad+4}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <text x="${pad-4}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="9" fill="rgba(255,255,255,.3)">${w}</text>`;
      }).join("")}
      <!-- Line -->
      <path d="${pathD}" fill="none" stroke="#4f8ef7" stroke-width="2" stroke-linejoin="round"/>
      <!-- Area fill -->
      <path d="${pathD} L${pts[pts.length-1].x.toFixed(1)},${chartH-pad} L${pts[0].x.toFixed(1)},${chartH-pad} Z" fill="url(#chartGrad)" opacity="0.3"/>
      <defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f8ef7"/><stop offset="100%" stop-color="#4f8ef7" stop-opacity="0"/></linearGradient></defs>
      <!-- Points -->
      ${pts.map(function(p,i){
        var isMax = p.d.weight===maxW;
        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isMax?5:3}" fill="${isMax?"#22c55e":"#4f8ef7"}" stroke="${isMax?"rgba(34,197,94,.3)":"rgba(79,142,247,.3)"}" stroke-width="${isMax?4:2}"/>
        ${i===data.length-1||isMax?`<text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" text-anchor="middle" font-size="9" fill="${isMax?"#22c55e":"#4f8ef7"}" font-weight="700">${p.d.weight}lbs</text>`:""}`;
      }).join("")}
      <!-- X axis dates -->
      ${pts.filter(function(_,i){return i===0||i===pts.length-1||i===Math.floor(pts.length/2);}).map(function(p){
        return `<text x="${p.x.toFixed(1)}" y="${chartH-4}" text-anchor="middle" font-size="8" fill="rgba(255,255,255,.3)">${p.d.date.slice(5)}</text>`;
      }).join("")}
    </svg>
    ${data.length>=3?`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px">
      <div style="background:var(--bg3);border-radius:var(--rs);padding:8px;text-align:center">

// ══════════════════════════════════════════════════
// REST TIMER
// ══════════════════════════════════════════════════
let timerInt = null;
let timerEndTime = null; // absolute end time so background doesn't drift

// When app comes back into focus (unlock, tab switch back), check timer immediately
// WakeLock blocked by GitHub Pages permissions policy — users should set
// Settings → Display & Brightness → Auto-Lock → Never while working out
// Re-acquire lock when app comes back to foreground (iOS releases it when backgrounded)
document.addEventListener("visibilitychange", function() {
  if(document.visibilityState === "visible" && timerEndTime && ST.restTimer) {
    var remaining = Math.round((timerEndTime - Date.now()) / 1000);
    if(remaining <= 0) {
      // Timer expired while phone was locked — just cancel silently, don't fire alert
      stopTimer();
    }
  }
});

function requestNotificationPermission() {
  if("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

// Audio — use embedded WAV element for iOS reliability
// iOS allows audio.play() from a timer callback as long as the element
// was "unlocked" by a previous user tap
var _beepEl = null;
var _beepUnlocked = false;

function getBeepEl() {
  if(!_beepEl) {
    _beepEl = document.getElementById("beep-sound");
    if(_beepEl) {
      // When beep finishes, nudge iOS to resume background audio
      _beepEl.addEventListener("ended", function() {
        // Brief silence then resume — iOS sometimes needs this nudge
        if(_beepEl.audioSession) {
          try { _beepEl.audioSession.type = "ambient"; } catch(e) {}
        }
      });
    }
  }
  return _beepEl;
}

// Unlock audio on every user tap
function unlockAudio() {
  if(_beepUnlocked) return;
  // Use a silent AudioContext buffer to unlock — this does NOT interrupt background music
  // unlike playing an <audio> element even at volume 0
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var buf = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    src.stop(0.001);
    _beepUnlocked = true;
    ctx.close();
  } catch(e) {}
}

document.addEventListener("touchstart", unlockAudio, {passive: true});
document.addEventListener("touchend",   unlockAudio, {passive: true});
document.addEventListener("click",      unlockAudio, {passive: true});

function playBeeps() {
  var el = getBeepEl();
  if(!el) { console.log("beep-sound element not found"); return; }
  try {
    el.currentTime = 0;
    el.volume = 1;
    if(el.audioSession) { try { el.audioSession.type = "transient"; } catch(e) {} }
    var p = el.play();
    if(p && p.catch) p.catch(function(e){ console.log("Beep play failed:", e.name, e.message); });
  } catch(e) { console.log("Beep error:", e); }
}

function sendRestDoneNotification(restLabel) {
  // 1. Vibrate
  if(navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);

  // 2. Play beep
  playBeeps();

  // 3. Speech
  try {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance("Next set!");
    msg.volume = 1; msg.rate = 0.9; msg.pitch = 1.1;
    window.speechSynthesis.speak(msg);
  } catch(e) {}

  // 4. Push notification
  if("Notification" in window && Notification.permission === "granted") {
    try { new Notification("Rest done! 💪", {body:"Time to hit your next set", tag:"rest-timer"}); } catch(e) {}
  }
}

function startTimer(rest) {
  stopTimer();
  requestNotificationPermission();
  const map = {"3 min":180,"2 min":120,"90 sec":90,"60 sec":60,"45 sec":45};
  const secs = Object.entries(map).reduce((a,[k,v])=>rest&&rest.includes(k.split(" ")[0])?v:a, 90);
  timerEndTime = Date.now() + secs * 1000;
  ST.restTimer = {secs, total:secs};

  // Render timer UI
  const existing = document.querySelector(".rtimer");
  if(!existing) {
    const div = document.createElement("div");
    document.getElementById("app")?.appendChild(div);
    div.outerHTML = renderTimer();
  }

  timerInt = setInterval(()=>{
    if(!ST.restTimer || !timerEndTime) { clearInterval(timerInt); return; }
    // Use absolute time so background doesn't cause drift
    const remaining = Math.round((timerEndTime - Date.now()) / 1000);
    if(remaining <= 0) {
      stopTimer();
      sendRestDoneNotification(rest);
      return;
    }
    ST.restTimer.secs = remaining;
    const tc=document.getElementById("rtc"), tb=document.getElementById("rtb");
    const m=Math.floor(remaining/60), s=remaining%60;
    if(tc) tc.textContent=`${m}:${s.toString().padStart(2,"0")}`;
    if(tb) tb.style.width=`${(remaining/ST.restTimer.total)*100}%`;
  }, 500); // check every 500ms for accuracy
}

function stopTimer() {
  clearInterval(timerInt);
  timerInt = null;
  timerEndTime = null;
  ST.restTimer = null;
  const el = document.querySelector(".rtimer");
  if(el) el.remove();
}

function addWater(amt) {
  const t=today(); let log=ST.nutritionLogs.find(l=>l.date===t&&l.type==="water");
  if(log) {
    log.liters=Math.max(0,Math.round((log.liters+amt)*100)/100);
    saveWaterLog(log);

{"name":"exact exercise name","muscle":"primary muscle group","type":"compound|isolation|bodyweight|cardio","sets":3,"reps":"8-12","rest":"90s","steps":["step 1","step 2"],"proTip":"one tip"}`}]})

    setTimeout(function(){alert("✅ \""+mealFood.n+"\" saved to My Foods! You can find it in search anytime.");},100);
  });

  // EDIT CUSTOM FOOD
  $$("[data-edit-custom]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    try { ST.editingCustomFood=JSON.parse(el.dataset.editCustom.replace(/&#39;/g,"'")); } catch{}
    render();
  }));
  $("[data-action='close-edit-custom']")?.addEventListener("click",()=>{ST.editingCustomFood=null;render();});
  $("[data-action='save-edit-custom']")?.addEventListener("click",()=>{
    var f=ST.editingCustomFood; if(!f) return;
    var oldName=f.n;
    var updated={
      id:   f.id||oldName.replace(/\s+/g,"_").toLowerCase(),
      n:    document.getElementById("ecf-name")?.value.trim()||f.n,
      cal:  parseFloat(document.getElementById("ecf-cal")?.value)||f.cal,
      p:    parseFloat(document.getElementById("ecf-p")?.value)||f.p,
      c:    parseFloat(document.getElementById("ecf-c")?.value)||f.c,
      f:    parseFloat(document.getElementById("ecf-f")?.value)||f.f,
      cat:  f.cat||"Custom",
      serving_label: document.getElementById("ecf-label")?.value||f.serving_label,
      serving_grams: parseFloat(document.getElementById("ecf-grams")?.value)||f.serving_grams||100,
      food_type: f.food_type||"A",
      source: f.source||"manual"
    };
    var idx=ST.customFoods.findIndex(function(x){return x.n===oldName||x.id===f.id;});
    if(idx>=0) ST.customFoods[idx]=updated;
    else ST.customFoods.unshift(updated);
    save(); saveCustomFoodToCloud(updated);
    ST.editingCustomFood=null; render();
  });

  $$("[data-del-custom]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    var name = el.dataset.delCustom;
    var food = ST.customFoods.find(function(f){return f.n===name;});
    ST.customFoods = ST.customFoods.filter(function(f){return f.n!==name;});
    save();
    if(food && food.id) deleteFromCloud("custom_foods", food.id);
    // Remove just the food row from the DOM — no full render
    var row = el.closest("[data-custom-food-row]");
    if(row) {
      row.remove();
      // Update the count in the header
      var header = document.querySelector("[data-custom-foods-count]");
      if(header) header.textContent = "🤖 My Saved Foods (" + ST.customFoods.length + ")";
      // If no more custom foods, remove the whole section
      if(ST.customFoods.length === 0) {
        var section = document.querySelector("[data-custom-foods-section]");
        if(section) section.remove();
      }
    } else {
      render();
    }
  }));

  // PR VIEW TOGGLE (Records vs Charts)
  $$("[data-prview]").forEach(el=>el.addEventListener("click",()=>{
    ST.prView=el.dataset.prview; render();
  }));
  // EXERCISE CHART SELECTOR
  $$("[data-prchartex]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    ST.prChartEx=el.dataset.prchartex;
    var pg=document.getElementById("pg"); var sy=pg?pg.scrollTop:0;
    render();
    requestAnimationFrame(function(){ var pg2=document.getElementById("pg"); if(pg2) pg2.scrollTop=sy; });
  }));

  // WORKOUT VIEW TOGGLE (Log / PRs / back to plan)
  $$("[data-wview]").forEach(el=>el.addEventListener("click",()=>{
    ST.workoutView=el.dataset.wview;
    if(ST.workoutView==="prs"||ST.workoutView==="log") ST.historyTab=ST.workoutView;
    render();
  }));

  // HISTORY TAB TOGGLE (when not in workout tab)
  $$("[data-htab]").forEach(el=>el.addEventListener("click",()=>{ST.historyTab=el.dataset.htab;render();}));

  // EXPORT / IMPORT
  $("[data-action='export']")?.addEventListener("click",exportData);
  document.getElementById("import-file")?.addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);});

  // Attach sleep/steps surgical listeners
  attachSleepSteps();
}

// Attach listeners inside the food modal .modal div
function attachFoodModalInner() {
  var $ = function(sel){return document.querySelector(sel);};
  var $$ = function(sel){return document.querySelectorAll(sel);};

  // BREAKDOWN MODE LISTENERS
  var bdBackBtn = document.getElementById("bd-back-btn");
  if(bdBackBtn) bdBackBtn.addEventListener("click", function(){ ST.breakdown=null; var modal=document.querySelector(".modal"); if(modal){modal.innerHTML=buildFoodModalInner();attachFoodModalInner();} });

  if(ST.breakdown) {
    ST.breakdown.components.forEach(function(c, i) {
      // Store per-100g values on first load for recalculation
      if(c._cal100 === undefined && c.grams > 0) {
        c._cal100 = (c.cal / c.grams) * 100;
        c._p100   = (c.p   / c.grams) * 100;
        c._c100   = (c.c   / c.grams) * 100;
        c._f100   = (c.f   / c.grams) * 100;
      }
      var gramsEl = document.getElementById("bd-grams-"+i);
      if(gramsEl) gramsEl.addEventListener("input", function(){
        var g = parseFloat(gramsEl.value) || 0;
        c.grams = g;
        if(c._cal100 !== undefined) {
          c.cal = Math.round(c._cal100 * g / 100);
          c.p   = Math.round(c._p100  * g / 100 * 10) / 10;
          c.c   = Math.round(c._c100  * g / 100 * 10) / 10;
          c.f   = Math.round(c._f100  * g / 100 * 10) / 10;
        }
        var macroEl = document.getElementById("bd-macros-"+i);
        if(macroEl) macroEl.textContent = c.cal+" kcal · P:"+ri(c.p)+"g C:"+ri(c.c)+"g F:"+ri(c.f)+"g";
        updateBDTotals();
      });
      var delBtn = document.getElementById("bd-del-"+i);
      if(delBtn) delBtn.addEventListener("click", function(e){
        e.stopPropagation();
        ST.breakdown.components.splice(i, 1);
        var modal = document.querySelector(".modal");
        if(modal){ modal.innerHTML=buildFoodModalInner(); attachFoodModalInner(); }
      });
    });

    // Breakdown search
    var bdSearchEl = document.getElementById("bd-search-input");
    if(bdSearchEl) bdSearchEl.addEventListener("input", function(){
      ST.breakdown.bdSearch = bdSearchEl.value;
      var results = bdSearchEl.value.length >= 1 ? searchFoods(bdSearchEl.value) : [];
      var rEl = document.getElementById("bd-search-results");
      if(rEl) {
        if(results.length > 0) {
          rEl.innerHTML = `<div class="fsr">${results.map(f=>`<div class="bd-add-item" data-bd-food='${JSON.stringify({name:f.n,cal100:f.cal,p100:f.p,c100:f.c,f100:f.f}).replace(/'/g,"&#39;")}' style="padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--border)"><div class="fsr-name">${f.n}</div><div class="fsr-macros">${f.cal} kcal per 100g</div></div>`).join("")}</div>`;
          rEl.querySelectorAll("[data-bd-food]").forEach(function(el2){
            el2.addEventListener("click", function(e){ e.stopPropagation(); addBDIngredient(el2.dataset.bdFood); });
          });
        } else if(bdSearchEl.value.length >= 2) {
          rEl.innerHTML = `<div style="padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-top:4px"><div style="font-size:12px;color:var(--muted);margin-bottom:8px">Not in database — ask Claude?</div><button id="bd-ask-claude-btn" class="btn bpur bfull" style="font-size:12px;padding:8px">🤖 Ask Claude for "${bdSearchEl.value}"</button></div>`;
          attachBDAskClaude();
        } else {
          rEl.innerHTML = "";
        }
      }
    });

    function attachBDAskClaude() {
      var btn = document.getElementById("bd-ask-claude-btn");
      if(!btn) return;
      btn.addEventListener("click", async function(){
        var query = ST.breakdown.bdSearch;
        btn.textContent = "Looking up…"; btn.disabled = true;
        try {
          var resp = await fetch("https://fitness-proxy.leonsilvadiego.workers.dev", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({model:"claude-sonnet-4-5", max_tokens:200, messages:[{role:"user",
              content:`Nutrition for "${query}" per 100g. Respond ONLY with JSON: {"name":"${query}","cal":0,"p":0,"c":0,"f":0}`}]})
          });
          var json = JSON.parse(await resp.text());
          var text = (json.content&&json.content[0]&&json.content[0].text)||"";
          var match = text.match(/\{[\s\S]*\}/);
          if(match) {
            var f = JSON.parse(match[0]);
            if(f.name && f.cal !== undefined) {
              addBDIngredient(JSON.stringify({name:f.name, cal100:f.cal, p100:f.p||0, c100:f.c||0, f100:f.f||0}));
              return;
            }
          }
        } catch(e) { console.log("BD ask claude error:", e); }
        btn.textContent = "🤖 Ask Claude"; btn.disabled = false;
      });
    }
    attachBDAskClaude();
    document.querySelectorAll("[data-bd-food]").forEach(function(el2){
      el2.addEventListener("click", function(e){ e.stopPropagation(); addBDIngredient(el2.dataset.bdFood); });
    });

    var bdLogBtn = document.getElementById("bd-log-btn");
    if(bdLogBtn) bdLogBtn.addEventListener("click", function(){
      var bd=ST.breakdown, tot=getBDTotal(), totalG=getBDTotalG();
      ST.foodEntry.food = {n:bd.name,cat:"Claude Lookup",food_type:"C",source:"claude",
        cal:Math.round((tot.cal/totalG)*100), p:Math.round((tot.p/totalG)*100*10)/10,
        c:Math.round((tot.c/totalG)*100*10)/10, f:Math.round((tot.f/totalG)*100*10)/10,
        serving_label:"1 serving (~"+Math.round(totalG)+"g)", serving_grams:Math.round(totalG)};
      ST.foodEntry.grams=String(Math.round(totalG)); ST.breakdown=null;
      var modal=document.querySelector(".modal"); if(modal){modal.innerHTML=buildFoodModalInner();attachFoodModalInner();}
    });
    var bdSaveBtn = document.getElementById("bd-save-btn");
    if(bdSaveBtn) bdSaveBtn.addEventListener("click", function(){
      var bd=ST.breakdown, tot=getBDTotal(), totalG=getBDTotalG();
      var meal = {id:bd.name.replace(/\s+/g,"_").toLowerCase()+"_"+Date.now(), n:bd.name,
        cat:"Custom Meal", food_type:"C", source:"meal",
        cal:Math.round((tot.cal/totalG)*100), p:Math.round((tot.p/totalG)*100*10)/10,
        c:Math.round((tot.c/totalG)*100*10)/10, f:Math.round((tot.f/totalG)*100*10)/10,
        serving_label:"1 serving (~"+Math.round(totalG)+"g)", serving_grams:Math.round(totalG)};
      saveCustomFood(meal,"meal");
      ST.foodEntry.food=meal; ST.foodEntry.grams=String(Math.round(totalG)); ST.breakdown=null;
      var modal=document.querySelector(".modal"); if(modal){modal.innerHTML=buildFoodModalInner();attachFoodModalInner();}
      setTimeout(function(){alert("✅ \""+meal.n+"\" saved to My Foods!");},100);
    });
  }

  // PHOTO INPUTS — camera and library
  var camEl = document.getElementById("food-photo-camera");
  var libEl = document.getElementById("food-photo-library");
  [camEl, libEl].forEach(function(el){
    if(!el) return;
    el.addEventListener("change", function(){
      var file = el.files[0];
      if(!file) return;
      lookupFoodFromPhoto(file);
    });
  });
  document.querySelectorAll(".quick-serving-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      ST.foodEntry.grams = btn.dataset.qg;
      // Rebuild modal to show active state + update preview
      var modalEl = document.querySelector(".modal");
      if(modalEl){ modalEl.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }
    });
  });

  // Search input — surgical update: only rebuild results, never touch the input itself
  var fsEl = document.getElementById("food-search-input");
  if(fsEl) {
    fsEl.addEventListener("input", function() {
      ST.foodSearch = fsEl.value;
      ST.foodResults = searchFoods(fsEl.value);
      var belowEl = document.getElementById("food-below-search");
      if(belowEl) {
        belowEl.innerHTML = buildBelowSearch();
        // Rewire result item clicks and Ask Claude button
        belowEl.querySelectorAll("[data-sel-food]").forEach(function(el){
          el.addEventListener("click", function(){
            try { ST.foodEntry.food=JSON.parse(el.dataset.selFood.replace(/&#39;/g,"'")); } catch {}
            ST.foodResults=[]; ST.foodSearch=ST.foodEntry.food.n;
            if(ST.foodEntry.food.cat==="Claude Lookup" && ST.foodEntry.food.serving_grams && ST.foodEntry.food.food_type!=="A") {
              ST.foodEntry.grams=String(ST.foodEntry.food.serving_grams);
            } else if(!ST.editingFood) { ST.foodEntry.grams=""; }
            var modalEl=document.querySelector(".modal");
            if(modalEl){ modalEl.innerHTML=buildFoodModalInner(); attachFoodModalInner(); }
          });
        });
        var askBtn2 = document.getElementById("ask-claude-btn");
        if(askBtn2) askBtn2.addEventListener("click", function(){ lookupFoodWithClaude(ST.foodSearch); });
      }
    });
  }

  // Ask Claude button
  var askBtn = document.getElementById("ask-claude-btn");
  if(askBtn) {
    askBtn.addEventListener("click", function() {
      lookupFoodWithClaude(ST.foodSearch);
    });
  }

  // Select food from search results
  $$("[data-sel-food]").forEach(function(el){
    el.addEventListener("click",function(){
      try { ST.foodEntry.food=JSON.parse(el.dataset.selFood.replace(/&#39;/g,"'")); } catch {}
      ST.foodResults=[]; ST.foodSearch=ST.foodEntry.food.n;
      // Pre-fill grams with natural serving size for Claude lookups
      if(ST.foodEntry.food.cat==="Claude Lookup" && ST.foodEntry.food.serving_grams && ST.foodEntry.food.food_type !== "A") {
        ST.foodEntry.grams = String(ST.foodEntry.food.serving_grams);
      } else if(!ST.editingFood) {
        ST.foodEntry.grams="";
      }
      var modalEl=document.querySelector(".modal");
      if(modalEl){ modalEl.innerHTML=buildFoodModalInner(); attachFoodModalInner(); }
      // Focus grams input if already pre-filled, otherwise search
      setTimeout(function(){
        var gi = document.getElementById("food-grams-input");
        if(gi) gi.focus();
      },100);
    });
  });

  // Grams input — only update preview, never re-render
  var gramsEl=document.getElementById("food-grams-input");
  if(gramsEl) {
    gramsEl.addEventListener("input",function(){
      ST.foodEntry.grams=gramsEl.value;
      updateMacroPreview();
    });
  }

  // Save / Update button
  var saveBtn=document.getElementById("save-food-btn");
  if(saveBtn) {
    saveBtn.addEventListener("click",function(){
      var g=document.getElementById("food-grams-input")?.value;
      if(g) ST.foodEntry.grams=g;
      if(!ST.foodEntry.food||!ST.foodEntry.grams) return;
      var m=calcMacros(ST.foodEntry.food,ST.foodEntry.grams);
      if(ST.editingFood) {
        var updated={id:ST.editingFood.id,date:ST.editingFood.date,type:"food",name:ST.foodEntry.food.n,grams:parseFloat(ST.foodEntry.grams),cal:m.cal,p:m.p,c:m.c,f:m.f};
        var idx=ST.nutritionLogs.findIndex(function(l){return l.id===ST.editingFood.id;});
        if(idx>=0) ST.nutritionLogs[idx]=updated;
        saveNutritionLog(updated);
        ST.editingFood=null;
      } else {
        var logDate = (ST.nutTab==="week" && ST.weekDay) ? ST.weekDay : today();
        var entry={id:Date.now().toString(),date:logDate,type:"food",name:ST.foodEntry.food.n,grams:parseFloat(ST.foodEntry.grams),cal:m.cal,p:m.p,c:m.c,f:m.f};
        ST.nutritionLogs.unshift(entry);
        saveNutritionLog(entry);
      }
      ST.showFoodModal=false; render();
    });
  }
}

// ══════════════════════════════════════════════════
// BOOT — load from Supabase, fall back to localStorage
// ══════════════════════════════════════════════════
function showLoader() {
  var appEl = document.getElementById("app");
  if(!appEl) return;
  appEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:16px;background:#0a0a0f"><div style="font-family:Arial Black,Arial,sans-serif;font-size:42px;letter-spacing:2px;color:#4f8ef7">DIEGO\'S</div><div style="font-family:Arial Black,Arial,sans-serif;font-size:22px;letter-spacing:1px;color:#6b6b88">FITNESS TRACKER</div><div style="width:40px;height:40px;border:3px solid #2a2a3a;border-top-color:#4f8ef7;border-radius:50%;animation:spin 1s linear infinite;margin-top:20px"></div><div style="font-size:13px;color:#6b6b88;margin-top:4px">Loading your data\u2026</div></div>';
}

function loadFromCache() {
  ST.workoutLogs   = S.get("wl", []);
  ST.bodyStats     = S.get("bs", [{id:"init", date:new Date().toISOString().split("T")[0], weight:173, bf:19, waist:null, notes:"Starting point"}]);
  ST.nutritionLogs = S.get("nl", []);
  ST.aiReports     = S.get("air", []);
  ST.customFoods   = S.get("cf", []);
  ST.dailyLogs     = S.get("dl", []);
  ST.online        = false;
}

function boot() {
  loadTargets();
  loadSettings();
  loadWorkoutProgress();
  showLoader();

  // Set a 6 second timeout — if Supabase doesn't respond, use cache
  var timer = setTimeout(function() {
    loadFromCache();
    render();
  }, 6000);

  Promise.all([
    sbSelect("workout_logs"),
    sbSelect("body_stats"),
    sbSelect("nutrition_logs"),
    sbSelect("ai_reports"),
    sbSelect("custom_foods"),
    sbSelect("daily_logs")
  ]).then(function(results) {
    clearTimeout(timer);
    var wl = results[0], bs = results[1], nl = results[2], air = results[3], cf = results[4], dl = results[5];

    if(wl !== null) {
      ST.workoutLogs   = wl.map(function(r)  { return {id:r.id, dayId:r.day_id, date:r.date, duration:r.duration, exercises:r.exercises||[]}; });
      ST.bodyStats     = bs.map(function(r)  { return {id:r.id, date:r.date, weight:r.weight, bf:r.bf, waist:r.waist, chest:r.chest, hips:r.hips, r_arm:r.r_arm, l_arm:r.l_arm, r_thigh:r.r_thigh, l_thigh:r.l_thigh, sleep:r.sleep, notes:r.notes, photo_path:r.photo_path||null}; });
      ST.nutritionLogs = nl.map(function(r)  { return {id:r.id, date:r.date, type:r.type, name:r.name, grams:r.grams, cal:r.cal, p:r.p, c:r.c, f:r.f, liters:r.liters}; });
      const airFromSupabase = air.map(function(r) { return {id:r.id, date:r.date, windowStart:r.window_start||null, report:r.report, notes:r.notes||"", snapshot:r.snapshot}; });
      // Merge: keep any local reports not yet in Supabase, then add Supabase ones
      const localIds = new Set(airFromSupabase.map(function(r){return r.id;}));
      const localOnly = ST.aiReports.filter(function(r){return !localIds.has(r.id);});
      ST.aiReports = localOnly.concat(airFromSupabase).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
      ST.customFoods   = (cf||[]).map(function(r) { return {id:r.id, n:r.name, cal:r.cal, p:r.p, c:r.c, f:r.f, cat:r.cat||"Custom", serving_label:r.serving_label, serving_grams:r.serving_grams, food_type:r.food_type||"A", source:r.source||"claude"}; });
      ST.dailyLogs     = (dl||[]).map(function(r) { return {id:r.id, date:r.date, steps:r.steps, sleep_hours:r.sleep_hours}; });
      S.set("wl",  ST.workoutLogs);
      S.set("bs",  ST.bodyStats);
      S.set("nl",  ST.nutritionLogs);
      S.set("air", ST.aiReports);
      S.set("cf",  ST.customFoods);
      S.set("dl",  ST.dailyLogs);
      ST.online = true;
    } else {
      loadFromCache();
    }
    render();
  }).catch(function() {
    clearTimeout(timer);
    loadFromCache();
    render();
  });
}

// Workout progress persistence — survives app close
function saveWorkoutProgress() {
  if(ST.activeDay) {
    S.set("wp_day", ST.activeDay);
    S.set("wp_sets", ST.activeSets);
    S.set("wp_openex", ST.openEx);
    S.set("wp_extra", ST.extraExercises||[]);
  }
}
function clearWorkoutProgress() {
  S.set("wp_day", null); S.set("wp_sets", {}); S.set("wp_openex", {}); S.set("wp_extra", []);
  ST.extraExercises = []; ST.exSearchQ = "";
}
function loadWorkoutProgress() {
  var day = S.get("wp_day", null);
  var sets = S.get("wp_sets", null);
  var openEx = S.get("wp_openex", null);
  var extra = S.get("wp_extra", []);
  if(day && sets) {
    ST.activeDay = day;
    ST.activeSets = sets;
    ST.openEx = openEx || {};
    ST.extraExercises = extra || [];
    ST.showDayPicker = false;
    var plan = PLAN[day];
    if(plan) {
      plan.exercises.forEach(function(ex) {
        var exSets = sets[ex.id] || [];
        var hasAny = exSets.some(function(s){ return s.weight || s.reps; });
        var allDone = exSets.length > 0 && exSets.every(function(s){ return s.done; });
        if(hasAny && !allDone) ST.openEx[ex.id] = true;
        if(allDone) ST.openEx[ex.id] = false;
      });
    }
    // Also restore open state for extra exercises
    (extra||[]).forEach(function(ex) {
      var exSets = sets[ex.id] || [];
      var hasAny = exSets.some(function(s){ return s.weight || s.reps; });
      var allDone = exSets.length > 0 && exSets.every(function(s){ return s.done; });
      if(hasAny && !allDone) ST.openEx[ex.id] = true;
      if(allDone) ST.openEx[ex.id] = false;
    });
  }
}

// Global click delegation — handles elements that may not exist when attachAll runs
document.addEventListener("click", function(e) {
  // Timer stop button — works from any tab
  var stopBtn = e.target.closest("[data-action='stop-timer']");
  if(stopBtn) {
    e.stopPropagation();
    var pg = document.getElementById("pg");
    var sy = pg ? pg.scrollTop : 0;
    stopTimer();
    render();
    requestAnimationFrame(function(){ var pg2=document.getElementById("pg"); if(pg2) pg2.scrollTop=sy; });
    return;
  }
  // Tempo explanation popup
  var tempoEl = e.target.closest("[data-tempo]");
  if(tempoEl) { e.stopPropagation(); ST.tempoPopup=tempoEl.dataset.tempo; render(); return; }
  // START DAY — here so it never accumulates duplicate listeners
  var startDayEl = e.target.closest("[data-start-day]");
  if(startDayEl) {
    var d = startDayEl.dataset.startDay;
    if(ST.activeDay===d && ST.showDayPicker) { ST.showDayPicker=false; render(); return; }
    if(ST.activeDay && ST.activeDay!==d) {
      var hasSets=Object.values(ST.activeSets).some(function(s){return s.some(function(set){return set.weight||set.reps;});});
      if(hasSets && !confirm("You have an active "+PLAN[ST.activeDay]?.label+" session. Start a different day? Your current progress will be lost.")) return;
      ST.activeSets={}; ST.openEx={}; ST.openGuide={};
    }
    if(!ST.activeDay || ST.activeDay!==d) {
      ST.activeDay=d; ST.activeSets={}; ST.openEx={}; ST.openGuide={};
      saveWorkoutProgress();
    }
    ST.showDayPicker=false; render(); return;
  }
}, true);
window.addEventListener("error", function(e) { console.error("App error:", e); });
window.addEventListener("unhandledrejection", function(e) { console.error("Promise error:", e); });

if(document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
