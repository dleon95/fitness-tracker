<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>Diego's Fitness Tracker</title>


<style>
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;
  --border:#2a2a3a;--text:#f0f0f8;--muted:#6b6b88;--muted2:#9090aa;
  --accent:#4f8ef7;--green:#22c55e;--red:#ef4444;--orange:#f97316;
  --yellow:#eab308;--teal:#06b6d4;--purple:#a855f7;
  --font-d:'Arial Black',Arial,sans-serif;--font-b:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-b);height:100%;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:100px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
/* NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(18,18,26,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 max(16px,env(safe-area-inset-bottom));z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0;transition:color .2s;font-family:var(--font-b)}
.nb.active{color:var(--accent)}
.ni{font-size:17px;line-height:1;width:40px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:99px;transition:background .2s}
.nb.active .ni{background:rgba(79,142,247,.18)}
.nl{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
/* HEADERS */
.ph{padding:52px 20px 14px;position:sticky;top:0;background:rgba(10,10,15,.97);backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid var(--border)}
.pt{font-family:var(--font-d);font-size:28px;letter-spacing:1px;line-height:1}
.ps{font-size:12px;color:var(--muted);margin-top:3px}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 16px 12px}
.ct{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sv{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;line-height:1}
.su{font-size:11px;color:var(--muted);margin-top:2px}
.sd{font-size:11px;font-weight:600;margin-top:4px}
.dg{color:var(--green)}.db{color:var(--red)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:var(--rs);font-family:var(--font-b);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.bp{background:var(--accent);color:#fff}.bp:active{transform:scale(.97);opacity:.9}
.bg{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.bs{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.bd{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.bpur{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.bfull{width:100%}.blg{padding:15px 24px;font-size:15px;border-radius:var(--r)}
/* PROGRESS BAR */
.pb-wrap{background:var(--bg3);border-radius:99px;height:8px;overflow:hidden;margin-top:5px}
.pb-fill{height:100%;border-radius:99px;transition:width .6s ease}
.pb-row{margin-bottom:11px}
.pb-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.pb-name{font-weight:600}.pb-val{color:var(--muted)}
/* EXERCISE BLOCKS */
.exb{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.exh{padding:12px 14px 10px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.exnum{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px}
.exnum.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--green)}
.exinfo{flex:1}.exname{font-weight:700;font-size:14px;line-height:1.2}
.exspec{font-size:11px;color:var(--muted);margin-top:3px}
.exarr{color:var(--muted);font-size:18px;align-self:center;transition:transform .2s}
.exarr.open{transform:rotate(180deg)}
/* FORM GUIDE */
.fguide{margin:0 14px 10px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--border)}
.fg-body{padding:12px 14px}
.fg-sec{margin-bottom:10px}
.fg-ttl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.fg-step{display:flex;gap:8px;margin-bottom:5px;font-size:12px;line-height:1.5;color:var(--muted2)}
.fg-snum{width:18px;height:18px;border-radius:50%;background:rgba(79,142,247,.15);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.fg-err{display:flex;gap:8px;margin-bottom:5px;font-size:12px;line-height:1.5;color:var(--muted2)}
.fg-x{color:var(--red);font-size:14px;flex-shrink:0}
.fg-tip{background:rgba(234,179,8,.08);border-left:3px solid var(--yellow);border-radius:0 var(--rs) var(--rs) 0;padding:8px 10px;font-size:12px;line-height:1.5;margin-top:4px}
/* SETS */
.sets-area{padding:0 14px 14px}
.sets-hdr{display:grid;grid-template-columns:32px 1fr 1fr 36px 24px;gap:6px;margin-bottom:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 2px}
.set-row{display:grid;grid-template-columns:32px 1fr 1fr 36px 24px;gap:6px;align-items:center;margin-bottom:8px}
.snum{width:32px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.snum.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--green)}
.sinput{height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font-b);font-size:15px;font-weight:600;text-align:center;width:100%;-webkit-appearance:none;transition:border-color .15s}
.sinput:focus{outline:none;border-color:var(--accent)}
.sinput::placeholder{color:var(--muted);font-size:12px}
.schk{width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s}
.schk.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4)}
.schk:active{transform:scale(.92)}
.add-set{width:100%;padding:8px;background:none;border:1px dashed var(--border);border-radius:var(--rs);color:var(--muted);font-family:var(--font-b);font-size:12px;font-weight:600;cursor:pointer;margin-top:2px}
/* WORKOUT ACTION BAR - fixed at bottom above nav */
.wact{padding:14px 16px;display:flex;gap:10px;position:fixed;bottom:calc(68px + max(16px,env(safe-area-inset-bottom)));left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,10,15,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:20}
/* REST TIMER */
.rtimer{position:fixed;bottom:calc(120px + max(6px,env(safe-area-inset-bottom)));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:var(--bg3);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 8px 32px rgba(79,142,247,.25);animation:sup .25s ease}
@keyframes sup{from{transform:translateX(-50%) translateY(20px);opacity:0}}
.rt-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.rt-count{font-family:var(--font-d);font-size:30px;letter-spacing:1px;flex:1}
.rt-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;padding:8px 16px;border-radius:var(--rs);font-family:var(--font-b);min-width:64px;min-height:44px}
.rt-bar{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);border-radius:0 0 var(--r) var(--r);transition:width 1s linear}
/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fi .2s ease}
@keyframes fi{from{opacity:0}}
.modal{width:100%;max-width:480px;margin:0 auto;background:var(--bg2);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--border);border-bottom:none;padding:20px 20px max(20px,env(safe-area-inset-bottom));animation:su2 .25s ease;max-height:92dvh;overflow-y:auto}
@keyframes su2{from{transform:translateY(100%)}}
.mhandle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 18px}
.mtitle{font-family:var(--font-d);font-size:26px;letter-spacing:1px;margin-bottom:16px}
/* FORMS */
.fgrp{margin-bottom:14px}
.flbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.finput{width:100%;height:44px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font-b);font-size:16px;padding:0 12px;transition:border-color .15s}
.finput:focus{outline:none;border-color:var(--accent)}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* FOOD */
.food-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.food-item:last-child{border-bottom:none}
.food-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.food-info{flex:1}
.food-name{font-weight:600;font-size:13px}
.food-macros{font-size:11px;color:var(--muted);margin-top:2px}
.food-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
/* FOOD SEARCH RESULTS */
.fsr{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-top:4px;max-height:200px;overflow-y:auto}
.fsr-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.fsr-item:last-child{border-bottom:none}
.fsr-item:active{background:var(--bg4)}
.fsr-name{font-weight:600;font-size:13px}
.fsr-macros{font-size:11px;color:var(--muted);margin-top:2px}
/* WATER */
.water-track{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.water-drop{font-size:26px;transition:all .15s;filter:grayscale(1);opacity:.3}
.water-drop.filled{filter:none;opacity:1}
/* STREAK */
.streak-row{display:flex;gap:5px;justify-content:center;padding:8px 0;flex-wrap:wrap}
.streak-day{width:30px;height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.streak-day.hit{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--green)}
.streak-day.miss{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:var(--red)}
/* HISTORY */
.log-item{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer}
.log-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-info{flex:1}
.log-title{font-weight:700;font-size:14px}
.log-date{font-size:12px;color:var(--muted);margin-top:2px}
.log-stats{display:flex;gap:14px;padding:8px 14px;background:var(--bg3);border-top:1px solid var(--border)}
.log-stat{font-size:12px;color:var(--muted)}
.log-stat strong{color:var(--text);font-weight:600}
.log-detail{padding:12px 14px;border-top:1px solid var(--border)}
.log-ex{font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)}
.log-ex:last-child{border-bottom:none}
.log-ex-name{font-weight:600;margin-bottom:2px}
.log-ex-sets{color:var(--muted)}
/* PR */
.pr-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.pr-item:last-child{border-bottom:none}
.pr-rank{font-family:var(--font-d);font-size:22px;color:var(--muted);width:32px}
.pr-info{flex:1}
.pr-name{font-weight:600;font-size:14px}
.pr-date{font-size:11px;color:var(--muted);margin-top:2px}
.pr-wt{text-align:right}
.pr-lbs{font-family:var(--font-d);font-size:26px;letter-spacing:.5px}
.pr-unit{font-size:11px;color:var(--muted)}
/* DAY CARD */
.daycard{margin:0 16px 10px;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;cursor:pointer;background:var(--bg2);transition:transform .15s}
.daycard:active{transform:scale(.98)}
.dc-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px}
.dc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dc-title{font-weight:700;font-size:15px;flex:1}
.dc-meta{font-size:12px;color:var(--muted)}
.dc-muscles{font-size:11px;color:var(--muted);padding:0 16px 10px}
.dc-foot{padding:10px 16px;background:var(--bg3);display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border)}
/* WELCOME */
.wbanner{margin:16px 16px 12px;background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(124,92,252,.15));border:1px solid rgba(79,142,247,.25);border-radius:var(--r);padding:18px}
.wname{font-family:var(--font-d);font-size:36px;letter-spacing:1px;line-height:1}
.wsub{font-size:13px;color:var(--muted);margin-top:6px}
/* RINGS */
.wrings{display:flex;gap:8px;justify-content:center;margin:14px 0 8px}
.rwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.rlabel{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.rsvg{width:40px;height:40px}
.rbg{fill:none;stroke:var(--bg3);stroke-width:4}
.rprog{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:20px 20px;transition:stroke-dashoffset .6s ease}
.rday{font-size:10px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:central}
/* CHEAT SHEET */
.cs-filter{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px}
.cs-filter::-webkit-scrollbar{display:none}
.cs-pill{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.cs-pill.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}
.cs-search{margin:12px 16px 0;position:relative}
.cs-search input{width:100%;height:42px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font-b);font-size:15px;padding:0 12px 0 36px}
.cs-search input:focus{outline:none;border-color:var(--accent)}
.cs-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.cs-table{margin:10px 16px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cs-thead{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);gap:4px}
.cs-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;padding:10px 12px;border-bottom:1px solid var(--border);gap:4px;align-items:center;cursor:pointer;transition:background .15s;user-select:none}
.cs-row:last-child{border-bottom:none}
.cs-row:active{background:var(--bg3)}
.cs-row.expanded{background:rgba(79,142,247,.05)}
.cs-fname{font-weight:600;font-size:13px}
.cs-cat{font-size:10px;color:var(--muted);margin-top:2px}
.cs-num{font-size:13px;font-weight:600;text-align:right}
.cs-detail{background:var(--bg3);border-bottom:1px solid var(--border);padding:12px 14px;font-size:12px;color:var(--muted2);line-height:1.6}
.cs-serving{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cs-sv-item{background:var(--bg2);border-radius:var(--rs);padding:8px 10px}
.cs-sv-label{color:var(--muted);margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.cs-sv-macros{font-weight:600;color:var(--text);font-size:12px}
/* TAB PILLS */
.tab-pills{display:flex;gap:8px;margin:12px 16px;overflow-x:auto;scrollbar-width:none}
.tab-pills::-webkit-scrollbar{display:none}
.tab-pill{flex-shrink:0;padding:7px 16px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tab-pill.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}
/* AI */
.ai-banner{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(79,142,247,.2));border:1px solid rgba(168,85,247,.3);border-radius:var(--r);padding:18px;margin:0 16px 12px}
.ai-report{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 16px 12px;font-size:13px;line-height:1.7;color:var(--muted2)}
.ai-report h3{color:var(--text);font-family:var(--font-d);font-size:18px;letter-spacing:.5px;margin:12px 0 6px}
.ai-report h3:first-child{margin-top:0}
.ai-report strong{color:var(--text)}
.ai-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* MISC */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.pill-a{background:rgba(79,142,247,.15);color:var(--accent)}
.chart-wrap{position:relative;height:190px;margin-top:10px}
</style>
</head>

// ── Supabase Storage (progress photos) ──────────────
async function sbUploadPhoto(statId, file) {
  var ext = "jpg";
  if(file.type === "image/png") ext = "png";
  var path = "photo_" + statId + "_" + Date.now() + "." + ext;
  console.log("Uploading photo:", path, "type:", file.type, "size:", file.size);
  try {
    var resp = await fetch(SUPA_URL + "/storage/v1/object/progress-photos/" + path, {
      method: "POST",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY,
        "Content-Type": "image/jpeg",
        "x-upsert": "true"
      },
      body: file
    });
    var respText = await resp.text();
    console.log("Upload response:", resp.status, respText);
    if(resp.ok) return path;
    alert("Photo upload failed: " + resp.status + " " + respText.slice(0,100));
    return null;
  } catch(e) {
    console.error("Upload error:", e);
    alert("Photo upload error: " + e.message);
    return null;
  }
}

async function sbDeletePhoto(path) {
  await fetch(SUPA_URL + "/storage/v1/object/progress-photos/" + path, {
    method: "DELETE",
    headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY }
  });
}

function sbPhotoUrl(path) {
  if(!path) return "";
  var cleanPath = path.replace(/^progress-photos\/?/, "");
  return SUPA_URL + "/storage/v1/object/public/progress-photos/" + cleanPath;
}

// Photo array helpers — photo_path stored as JSON array string in Supabase
function getPhotos(stat) {
  if(!stat.photo_path) return [];
  try {
    var parsed = JSON.parse(stat.photo_path);
    return Array.isArray(parsed) ? parsed : [stat.photo_path]; // handle legacy single string
  } catch(e) {
    return stat.photo_path ? [stat.photo_path] : []; // legacy single string
  }
}

function setPhotos(stat, photos) {
  stat.photo_path = photos.length > 0 ? JSON.stringify(photos) : null;
}

};

function getQuickServings(foodName) {
  // Exact match first
  if(QUICK_SERVINGS[foodName]) return QUICK_SERVINGS[foodName];
  // Partial match
  var key = Object.keys(QUICK_SERVINGS).find(function(k){
    return foodName.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(foodName.toLowerCase());
  });
  return key ? QUICK_SERVINGS[key] : null;
}

function upsertDailyLog(date, updates) {
  var existing = getDailyLog(date);
  if(existing) {
    Object.assign(existing, updates);
    saveDailyLog(existing);
  } else {
    var entry = Object.assign({id: date, date: date}, updates);
    ST.dailyLogs.unshift(entry);
    saveDailyLog(entry);
  }
}
function clientTs() {
  // Return timestamp in local timezone (not UTC) so Supabase stores the correct local time
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function fmtDate(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function today() {
  var d = new Date();
  var pad = function(n){ return String(n).padStart(2,"0"); };
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function getToday()   { return new Date().toLocaleDateString("en-US",{weekday:"short"}).toUpperCase().slice(0,3); }
function weekMon()    { var d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d; }
function weekLogs()   { var m=weekMon(); return ST.workoutLogs.filter(function(l){return new Date(l.date+"T12:00:00")>=m;}); }
function getLean(w,bf){ return bf ? +(w*(1-bf/100)).toFixed(1) : null; }
function daysAgo(iso) { return Math.round((Date.now()-new Date(iso+"T12:00:00"))/(86400000)); }
function weekNum()    { var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7); var w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7); }
function nutByDate(date) { return ST.nutritionLogs.filter(function(l){return l.date===date&&l.type==="food";}); }
function nutSum(entries)  { return entries.reduce(function(a,e){return {cal:a.cal+(e.cal||0),p:a.p+(e.p||0),c:a.c+(e.c||0),f:a.f+(e.f||0)};},{cal:0,p:0,c:0,f:0}); }
function todayWater()     { var l=ST.nutritionLogs.find(function(l){return l.date===today()&&l.type==="water";}); return l?l.liters:0; }
function calcMacros(food,grams) { var g=parseFloat(grams)||0,r=g/100; return {cal:Math.round(food.cal*r),p:Math.round(food.p*r),c:Math.round(food.c*r),f:Math.round(food.f*r)}; }
function ri(v) { return Math.round(parseFloat(v)||0); } // round to integer for display
function searchFoods(q) {
  if(!q || q.length < 1) return [];
  var ql = q.toLowerCase();
  // Search custom foods first (user's saved Claude lookups)
  var custom = ST.customFoods.filter(function(f){ return f.n.toLowerCase().indexOf(ql) >= 0; });
  // Then built-in database
  var builtin = FOODS.filter(function(f){ return f.n.toLowerCase().indexOf(ql) >= 0; });
  // Combine, dedupe by name, limit to 8
  var seen = {};
  var results = [];
  custom.concat(builtin).forEach(function(f){
    if(!seen[f.n]) { seen[f.n] = true; results.push(f); }
  });
  return results.slice(0, 8);
}

function saveCustomFood(food_entry, source) {
  // Don't save if already in built-in database
  var inDB = FOODS.some(function(f){ return f.n.toLowerCase() === food_entry.n.toLowerCase(); });
  if(inDB) return;
  food_entry.source = source || food_entry.source || "claude"; // "claude" or "manual"
  if(!food_entry.id) food_entry.id = food_entry.n.replace(/\s+/g,"_").toLowerCase() + "_" + Date.now();
  var exists = ST.customFoods.some(function(f){ return f.n.toLowerCase() === food_entry.n.toLowerCase(); });
  if(exists) {
    var idx = ST.customFoods.findIndex(function(f){ return f.n.toLowerCase() === food_entry.n.toLowerCase(); });
    if(idx >= 0) ST.customFoods[idx] = food_entry;
  } else {
    ST.customFoods.unshift(food_entry);
  }
  save();
  saveCustomFoodToCloud(food_entry);
}

async function lookupFoodWithClaude(query) {
  ST.foodLookingUp = true;
  ST.breakdown = null;
  var modalEl = document.querySelector(".modal");
  if(modalEl) { modalEl.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }

  try {
    var resp = await fetch("https://fitness-proxy.leonsilvadiego.workers.dev", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 800,
        messages: [{
          role: "user",
          content: `Look up nutrition info for: "${query}"

Determine the TYPE:
A = Raw ingredient (chicken, rice, oats) — return per 100g, no breakdown needed
B = Restaurant item (Big Mac, Wendy's sandwich) — return whole item, no breakdown needed  
E = Liquid/beverage — return per 100ml, no breakdown needed
C = Recipe/dish (lomo saltado, pad thai, curry) — return WITH ingredient breakdown
D = Combo meal — return WITH ingredient breakdown

For types A, B, E respond with:
{"name":"food name","cal":0,"p":0,"c":0,"f":0,"serving_label":"description","serving_grams":0,"type":"A|B|E"}

For types C and D respond with a breakdown of each component:
{"name":"dish name","type":"C","serving_label":"1 serving","serving_grams":0,"components":[
  {"name":"ingredient name","grams":0,"cal":0,"p":0,"c":0,"f":0},
  {"name":"ingredient name","grams":0,"cal":0,"p":0,"c":0,"f":0}
]}

List EVERY ingredient including oil, sauce, garnishes. Macros for each component are for the stated grams (not per 100g).
Use realistic restaurant portion sizes. Respond with ONLY the JSON, no other text.`
        }]
      })
    });
    var rawText = await resp.text();
    if(!resp.ok) throw new Error("Worker error " + resp.status);
    var json = JSON.parse(rawText);
    var text = (json.content && json.content[0] && json.content[0].text) || "";
    var match = text.match(/\{[\s\S]*\}/);
    if(match) {
      var food = JSON.parse(match[0]);
      if(food.name) {
        if((food.type==="C"||food.type==="D") && food.components && food.components.length > 0) {
          // Breakdown mode — show editable ingredient list
          ST.foodLookingUp = false;
          ST.breakdown = {
            name: food.name,
            serving_label: food.serving_label || "1 serving",
            components: food.components.map(function(c){ return {name:c.name, grams:c.grams, cal:c.cal, p:c.p||0, c:c.c||0, f:c.f||0}; }),
            bdSearch: ""
          };
          var modalEl2 = document.querySelector(".modal");
          if(modalEl2) { modalEl2.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }
          return;
        }
        // Simple item — old flow
        var sg = food.serving_grams || 100;
        var food_entry = {
          n: food.name, cal: Math.round((food.cal/sg)*100),
          p: Math.round((food.p/sg)*100*10)/10, c: Math.round((food.c/sg)*100*10)/10, f: Math.round((food.f/sg)*100*10)/10,
          cat: "Claude Lookup", serving_label: food.serving_label||"per 100g", serving_grams: sg, food_type: food.type||"A"
        };
        ST.foodLookingUp = false;
        ST.foodResults = [food_entry];
        saveCustomFood(food_entry);
        ST.pendingServingGrams = sg;
        var modalEl3 = document.querySelector(".modal");
        if(modalEl3) { modalEl3.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }
        return;
      }
    }
  } catch(e) { console.log("Lookup error:", e); }

  ST.foodLookingUp = false;
  ST.foodResults = [];
  var modalEl4 = document.querySelector(".modal");

function getExSkipCount(exId, exName, dayId) {

  var consecutive = 0;

    // Calves — high rep, slower upper progress
    stand_calf:   {inc:5,  slowInc:5},

    // Isolation legs
    leg_ext:      {inc:5,  slowInc:5},

    // Core/cardio — reps/time based
    plank_m:      {inc:5,  slowInc:5,  unit:"sec"},

    bike:         {inc:0},
    hang_knee:    {inc:1,  slowInc:1,  unit:"rep"},

function getSuggestedWeight(last, exId, exName) {
  if(!last || last.maxWeight <= 0) return null;
  var history = getExHistory(exId, exName, 6);
  if(history.length < 2) {
    var trainingWeeks = ST.workoutLogs.length > 0 ? Math.ceil((daysAgo(ST.workoutLogs[ST.workoutLogs.length-1].date)+1)/7) : 1;
    var prog = getProgressionIncrement(exId, trainingWeeks);
    if(prog.unit === "rep" || prog.amount === 0) return last.maxWeight;
    return last.totalSets >= 3 ? last.maxWeight + prog.amount : last.maxWeight;
  }

  // Training age in weeks
  var firstLog = ST.workoutLogs.length > 0 ? ST.workoutLogs[ST.workoutLogs.length-1].date : last.date;
  var trainingWeeks = Math.ceil((daysAgo(firstLog)+1)/7);
  var prog = getProgressionIncrement(exId, trainingWeeks);
  if(prog.amount === 0) return null;

  // Check for stall: same weight for 3+ sessions in a row
  var recentWeights = history.slice(0,3).map(function(h){ return h.maxWeight; });
  var isStalled = recentWeights.length >= 3 && recentWeights.every(function(w){ return w===recentWeights[0]; });

  var daysSinceLast = daysAgo(last.date);
  var longBreak = daysSinceLast > 10;
  var lastIncomplete = last.totalSets < 3;
  var repTrend = history.slice(0,3).map(function(h){ return h.maxReps; });
  var repsDropping = repTrend.length >= 3 && repTrend[0] < repTrend[1] && repTrend[1] < repTrend[2];

  if(isStalled && !longBreak) return Math.round(last.maxWeight * 0.9 / 2.5) * 2.5;
  if(longBreak) return Math.round(last.maxWeight * 0.9 / 2.5) * 2.5;
  if(lastIncomplete) return last.maxWeight;
  if(repsDropping) return last.maxWeight;

  return last.maxWeight + prog.amount;
}

function getProgressionNote(last, exId, exName) {
  if(!last || last.maxWeight <= 0) return null;
  var history = getExHistory(exId, exName, 6);
  if(history.length < 2) return null;

  var firstLog = ST.workoutLogs.length > 0 ? ST.workoutLogs[ST.workoutLogs.length-1].date : last.date;
  var trainingWeeks = Math.ceil((daysAgo(firstLog)+1)/7);
  var prog = getProgressionIncrement(exId, trainingWeeks);

  var recentWeights = history.slice(0,3).map(function(h){ return h.maxWeight; });
  var isStalled = recentWeights.length >= 3 && recentWeights.every(function(w){ return w===recentWeights[0]; });
  var daysSinceLast = daysAgo(last.date);
  var longBreak = daysSinceLast > 10;
  var lastIncomplete = last.totalSets < 3;
  var repTrend = history.slice(0,3).map(function(h){ return h.maxReps; });
  var repsDropping = repTrend.length >= 3 && repTrend[0] < repTrend[1] && repTrend[1] < repTrend[2];

  if(prog.amount === 0) return {text:"Track reps/time — no weight needed", color:"var(--muted)"};
  if(isStalled && !longBreak) return {text:"Stalled 3x — deload 10% and rebuild", color:"var(--orange)"};
  if(longBreak) return {text:`Back after ${daysSinceLast}d — ease in at 90%`, color:"var(--yellow)"};
  if(lastIncomplete) return {text:"Incomplete last session — hold weight", color:"var(--yellow)"};
  if(repsDropping) return {text:"Reps declining — hold weight, focus form", color:"var(--yellow)"};

  var phaseNote = trainingWeeks >= 13 ? " (slower phase)" : trainingWeeks >= 5 ? "" : " (newbie gains!)";
  return {text:`Add ${prog.amount}${prog.unit}${phaseNote}`, color:"var(--green)"};
}

function fmtReport(t) {
  if(!t) return "";
  var lines = t.split('\n');
  var html = '';
  lines.forEach(function(line) {
    line = line
      .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>');

    if(/^### /.test(line)) {
      html += '<h3 style="font-family:var(--font-d);font-size:15px;color:var(--accent);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid rgba(79,142,247,.2)">' + line.replace(/^### /,'') + '</h3>';
    } else if(/^## /.test(line)) {
      html += '<h2 style="font-family:var(--font-d);font-size:18px;color:var(--accent);margin:18px 0 10px">' + line.replace(/^## /,'') + '</h2>';
    } else if(/^# /.test(line)) {
      html += '<h2 style="font-family:var(--font-d);font-size:20px;color:var(--accent);margin:20px 0 10px">' + line.replace(/^# /,'') + '</h2>';
    } else if(/^- /.test(line) || /^• /.test(line)) {
      html += '<div style="display:flex;gap:8px;margin:3px 0 3px 8px"><span style="color:var(--accent);flex-shrink:0">•</span><span>' + line.replace(/^[-•] /,'') + '</span></div>';
    } else if(/^\d+\. /.test(line)) {
      var m = line.match(/^(\d+)\. (.*)/);
      if(m) html += '<div style="display:flex;gap:8px;margin:5px 0 5px 4px"><span style="color:var(--accent);font-weight:700;flex-shrink:0;min-width:20px">' + m[1] + '.</span><span>' + m[2] + '</span></div>';
    } else if(line.trim() === '') {
      html += '<div style="height:6px"></div>';
    } else {
      html += '<div style="margin:2px 0">' + line + '</div>';
    }
  });
  return html;
}

// ── WORKOUT DAY PICKER ─────────────────────────────
function getNextWorkoutSuggestion() {
  if(ST.workoutLogs.length === 0) return null;
  var sorted = [...ST.workoutLogs].sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var last = sorted[0];
  var daysSince = daysAgo(last.date);
  var lastIdx = DAY_ORDER.indexOf(last.dayId);
  if(lastIdx < 0) return null;
  var nextIdx = (lastIdx + 1) % DAY_ORDER.length;
  var nextDay = DAY_ORDER[nextIdx];
  var nextPlan = PLAN[nextDay];

  if(daysSince <= 2) {
    return {dayId: nextDay, plan: nextPlan, msg: "Next in sequence", sub: "Last: "+PLAN[last.dayId]?.label+" ("+daysSince+(daysSince===1?" day":" days")+" ago)", color: nextPlan.color};
  } else if(daysSince <= 6) {
    // Missed 3-6 days — still do next in sequence
    return {dayId: nextDay, plan: nextPlan, msg: "Pick up where you left off", sub: "Missed "+(daysSince-1)+" day(s) — continue with next session", color: "#eab308"};
  } else if(daysSince <= 13) {
    // Missed a week — suggest today's day in the rotation
    var todayDayOfWeek = ["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date().getDay()];
    var todayIdx = DAY_ORDER.indexOf(todayDayOfWeek);
    var suggestIdx = todayIdx >= 0 ? todayIdx : nextIdx;
    var suggestDay = DAY_ORDER[suggestIdx];
    return {dayId: suggestDay, plan: PLAN[suggestDay], msg: "Resume normal schedule", sub: "Missed "+Math.round(daysSince/7)+" week — skip to today's session", color: "#ef4444"};
  } else {
    // Missed 2+ weeks — start fresh from Monday
    return {dayId: "MON", plan: PLAN["MON"], msg: "Start fresh from Monday", sub: "Missed "+Math.floor(daysSince/7)+" weeks — begin new cycle", color: "#ef4444"};
  }
}

  const td = getToday();
  const inProgress = ST.activeDay && ST.showDayPicker;
  const suggestion = !inProgress ? getNextWorkoutSuggestion() : null;
  return `

function addExerciseToSession(dataStr) {
  try {
    var ex = JSON.parse(dataStr.replace(/&#39;/g,"'"));
    if(!ST.extraExercises) ST.extraExercises = [];
    // Don't add if already in plan or extras
    var allIds = (PLAN[ST.activeDay]?.exercises||[]).concat(ST.extraExercises).map(function(e){return e.id;});
    if(allIds.includes(ex.id)) return;
    // Create exercise object compatible with renderExBlock
    var newEx = {
      id: ex.id, name: ex.name, sets: 3, reps: "8-12",
      tempo: "2-0-1", rest: "60s",
      muscles: [ex.muscle], steps: [], mistakes: [], proTip: "Focus on form and controlled movement."
    };
    ST.extraExercises.push(newEx);
    ST.activeSets[ex.id] = [{weight:"",reps:"",done:false},{weight:"",reps:"",done:false},{weight:"",reps:"",done:false}];
    ST.openEx[ex.id] = true; // auto-open the new exercise
    ST.exSearchQ = ""; // clear search
    saveWorkoutProgress();
    render();
    // Scroll to the new exercise
    setTimeout(function(){
      var el = document.getElementById("ex-"+ex.id);
      if(el) el.scrollIntoView({behavior:"smooth", block:"nearest"});
    }, 100);
  } catch(e) { console.log("addExerciseToSession error:", e); }
}

function searchExercises(q) {
  if(!q || q.length < 1) return [];
  var ql = q.toLowerCase();
  return EXERCISE_LIBRARY.filter(function(e){
    return e.name.toLowerCase().includes(ql) || e.muscle.toLowerCase().includes(ql) || e.id.includes(ql);
  }).slice(0,8);
}

function renderWorkoutSession() {
  const plan = PLAN[ST.activeDay];
  plan.exercises.forEach(ex => { if(!ST.activeSets[ex.id]) ST.activeSets[ex.id] = Array.from({length:ex.sets},()=>({weight:"",reps:"",done:false})); });

  // Build full exercise list: plan exercises + any extras added this session
  const extraExercises = ST.extraExercises || [];
  const allExercises = plan.exercises.concat(extraExercises);

  // Exercise search results
  const exSearchQ = ST.exSearchQ || "";
  const exSearchResults = searchExercises(exSearchQ);
  const alreadyAdded = allExercises.map(function(e){return e.id;});

  return `
  <div style="padding:52px 20px 14px;position:sticky;top:0;background:rgba(10,10,15,.97);backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn bg" style="padding:6px 12px;font-size:12px" data-action="back-to-picker">‹ Back</button>

    <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">+ Add Exercise</div>

function renderExBlock(ex, idx) {
  const sets=ST.activeSets[ex.id]||[], open=ST.openEx[ex.id], guideOpen=ST.openGuide[ex.id];
  const doneCount=sets.filter(s=>s.done).length, allDone=doneCount===sets.length&&sets.length>0;
  const hasAnyEntry=sets.some(function(s){return s.weight||s.reps;});
  const planColor=PLAN[ST.activeDay].color;
  const borderStyle=allDone?`border-color:${planColor}55`:hasAnyEntry?`border-color:rgba(234,179,8,.65)`:``;
  const priority=getExPriority(ex.id);
  const last=getLastExSession(ex.id, ex.name);
  const suggested=getSuggestedWeight(last, ex.id, ex.name);
  const progNote=getProgressionNote(last, ex.id, ex.name);
  const targetCtx=getExerciseTargetContext(ex.id, ex, last, suggested);
  const skipCount=getExSkipCount(ex.id, ex.name, ST.activeDay);
  const priorityStyle={
    must:     {bg:"rgba(239,68,68,.15)",  color:"var(--red)",    label:"🔴 Must Do"},
    important:{bg:"rgba(234,179,8,.15)",  color:"var(--yellow)", label:"🟡 Important"},
    optional: {bg:"rgba(107,107,136,.15)",color:"var(--muted)",  label:"⚪ Optional"},
  }[priority];

  return `
  <div class="exb" style="${borderStyle}" id="ex-${ex.id}">
    <div class="exh" data-toggle-ex="${ex.id}">
      <div class="exnum${allDone?" done":""}">${allDone?"✓":(idx+1)}</div>
      <div class="exinfo">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <div class="exname">${ex.name}</div>
          <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:${priorityStyle.bg};color:${priorityStyle.color}">${priorityStyle.label}</span>
          ${skipCount>=2?`<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(239,68,68,.15);color:var(--red)">❗ Skipped ${skipCount}x</span>`:skipCount===1?`<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(249,115,22,.15);color:var(--orange)">⚠ Skipped last time</span>`:""}
        </div>
        <div class="exspec">${ex.sets}×${ex.reps} · <span data-tempo="${ex.tempo}" style="text-decoration:underline;text-decoration-style:dotted;cursor:pointer;color:var(--accent)">${ex.tempo}</span> · Rest ${ex.rest}${doneCount>0?` · <span style="color:var(--green)">${doneCount}/${sets.length} ✓</span>`:""}</div>
        <div style="font-size:11px;font-weight:700;color:var(--muted2);margin-top:3px">🎯 ${ex.muscles}</div>
        ${last ? `

        <div style="font-size:11px;color:var(--muted);margin-top:3px">
          Last ${fmtDate(last.date)}: <span style="color:var(--text);font-weight:600">${(last.allSets||[]).map(s=>(s.weight?s.weight+"×":"")+s.reps).join(" · ")}</span>
        </div>
        <!-- Target line (always visible) -->
        ${targetCtx.targetStr?`<div style="margin-top:4px;display:flex;align-items:center;gap:6px">
          <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">🎯</span>

        ` : `
        <div style="font-size:11px;color:var(--muted);margin-top:2px">No previous data — establish your baseline today</div>
        ${targetCtx.contextStr?`<div style="font-size:11px;color:var(--muted);margin-top:2px">🎯 ${targetCtx.contextStr}</div>`:""}`}

    ${last && last.allSets && last.allSets.length > 0 ? `

          ${isTop?`<div style="font-size:9px;font-weight:700;color:var(--accent);margin-left:8px;background:rgba(79,142,247,.15);padding:2px 6px;border-radius:99px">TOP</div>`:`<div style="width:44px"></div>`}
        </div>`;
      }).join("")}
    </div>` : ""}

    <!-- Target directive -->
    ${targetCtx.targetStr ? `
    <div style="margin:0 14px 10px;background:rgba(${targetCtx.color==="#4f8ef7"?"79,142,247":targetCtx.color==="#22c55e"?"34,197,94":"234,179,8"},.08);border:1px solid rgba(${targetCtx.color==="#4f8ef7"?"79,142,247":targetCtx.color==="#22c55e"?"34,197,94":"234,179,8"},.25);border-radius:var(--rs);padding:10px 12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">

      </div>
      <div style="font-size:11px;color:var(--muted)">${targetCtx.contextStr}</div>
      ${last ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;font-style:italic">Warm up with lighter sets before hitting working weight</div>` : ""}
    </div>` : ""}

    <!-- Today's sets -->
    <div style="margin:0 14px 4px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)">TODAY</div>
    <div class="sets-area">
      <div class="sets-hdr"><div>SET</div><div>WEIGHT</div><div>REPS</div><div>✓</div><div></div></div>
      ${sets.map((set,si)=>`<div class="set-row"><div class="snum${set.done?" done":""}">${si+1}</div><input class="sinput" type="number" inputmode="decimal" placeholder="${suggested||"lbs"}" value="${set.weight}" data-sw="${ex.id}" data-si="${si}"><input class="sinput" type="number" inputmode="numeric" placeholder="${ex.reps}" value="${set.reps}" data-sr="${ex.id}" data-si="${si}"><div class="schk${set.done?" done":""}" data-cs2="${ex.id}" data-si="${si}">${set.done?"✓":"○"}</div><button data-del-set="${ex.id}" data-del-si="${si}" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0;opacity:.6">×</button></div>`).join("")}
      <button class="add-set" data-add-set="${ex.id}">+ Add Set</button>
    </div>`:""}
  </div>`;
}

// Meal time detection based on Diego's schedule
function getMealContext() {
  var h = new Date().getHours();
  if(h >= 5 && h < 11)  return {id:"breakfast", label:"🌅 Breakfast",    tip:"Load up on protein + carbs to fuel your day",    carbOk:true,  carbNote:"Higher carbs fine — fuel for the day"};
  if(h >= 11 && h < 16) return {id:"lunch",     label:"☀️ Lunch",        tip:"Biggest meal — balanced protein, carbs, veg",     carbOk:true,  carbNote:"Balanced carbs OK"};
  if(h >= 16 && h < 21) return {id:"dinner",    label:"🌙 Dinner",       tip:"High protein, light carbs, plenty of vegetables", carbOk:false, carbNote:"Keep carbs under 50-60g"};
  return                        {id:"snack",     label:"🌙 Late",         tip:"Light snack only — protein focused",              carbOk:false, carbNote:"Protein only if possible"};
}

// Build dynamic meal suggestions based on remaining macros and what was eaten today/recently
function getDynamicMealSuggestions(mealCtx, remaining, pLeft, cLeft, fLeft) {
  // What did we eat today?
  var todayFoods = ST.nutritionLogs.filter(function(l){ return l.date===today() && l.type==="food"; }).map(function(l){ return (l.name||"").toLowerCase(); });
  // What have we eaten recently (last 3 days)?
  var recentFoods = {};
  ST.nutritionLogs.filter(function(l){ return l.type==="food" && daysAgo(l.date) <= 3; }).forEach(function(l){
    if(l.name) recentFoods[(l.name||"").toLowerCase()] = (recentFoods[(l.name||"").toLowerCase()]||0)+1;
  });

  var isDinner = mealCtx==="dinner" || mealCtx==="pack";
  var isBreakfast = mealCtx==="breakfast";

  // Score each food
  var scored = HEALTHY_FOODS.map(function(f){
    var score = 0;
    // Must fit the meal context
    if(!f.tags.includes(mealCtx) && !f.tags.includes("anytime")) return null;
    // Must fit calorie budget (with wiggle room)
    if(f.cal > remaining + 100) return null;
    // Penalize high carbs at dinner
    if(isDinner && f.c > 30) score -= 20;
    // Reward protein when needed
    if(pLeft > 30 && f.p >= 15) score += 30;
    if(pLeft > 30 && f.p >= 25) score += 20;
    // Reward vegetables
    if(f.tags.includes("veg")) score += 15;
    // Reward fiber/complex carbs for breakfast
    if(isBreakfast && f.tags.includes("fiber")) score += 10;
    // Penalize recently eaten foods
    var key = f.name.toLowerCase();
    if(todayFoods.some(function(t){ return t.includes(key.split(" ")[0]); })) score -= 40;
    if(recentFoods[key] >= 3) score -= 15;
    if(recentFoods[key] >= 2) score -= 8;
    return {food:f, score:score};
  }).filter(Boolean).sort(function(a,b){ return b.score-a.score; });

  // Build 3 meal combos from top scored foods
  var combos = [];
  var used = [];

  // Try to build protein + carb + veg combos
  var proteins = scored.filter(function(s){ return s.food.tags.includes("protein") && !used.includes(s.food.name); });
  var carbs = scored.filter(function(s){ return s.food.tags.includes("carbs") && !s.food.tags.includes("protein") && !used.includes(s.food.name); });
  var vegs = scored.filter(function(s){ return s.food.tags.includes("veg") && !used.includes(s.food.name); });

  for(var i=0; i<3 && proteins.length>i; i++) {
    var pFood = proteins[i].food;
    var combo = {foods:[pFood], cal:pFood.cal, p:pFood.p, c:pFood.c, f:pFood.f};

    // Add carb if not dinner and budget allows
    if(!isDinner && carbs.length > i && combo.cal + carbs[i].food.cal <= remaining + 100) {
      combo.foods.push(carbs[i].food);
      combo.cal += carbs[i].food.cal;
      combo.p += carbs[i].food.p;
      combo.c += carbs[i].food.c;
      combo.f += carbs[i].food.f;
    }
    // Add veg if budget allows
    var veg = vegs[i % vegs.length];
    if(veg && combo.cal + veg.food.cal <= remaining + 150) {
      combo.foods.push(veg.food);
      combo.cal += veg.food.cal;
      combo.p += veg.food.p;
      combo.c += veg.food.c;
      combo.f += veg.food.f;
    }

    var name = combo.foods.map(function(f){ return f.name; }).join(" + ");
    var desc = combo.foods.map(function(f){ return f.unit; }).join(", ");
    var emoji = combo.foods[0].emoji;
    combos.push({name:name, emoji:emoji, desc:desc, cal:Math.round(combo.cal), p:Math.round(combo.p), c:Math.round(combo.c), f:Math.round(combo.f)});
  }

  return combos.length > 0 ? combos : [
    {name:"Chicken breast + broccoli", emoji:"🍗", desc:"200g chicken, 200g broccoli", cal:220, p:35, c:11, f:5},
    {name:"Tilapia + zucchini",        emoji:"🐟", desc:"200g tilapia, 200g zucchini", cal:145, p:25, c:6,  f:2},
  ];
}

function buildFoodCalcResults(remaining, pLeft) {
  var q = ST.nutFoodQuery;
  if(!q || q.length < 2) return '<div style="font-size:11px;color:var(--muted)">Type a food to see how much fits your remaining budget</div>';
  var matches = searchFoods(q).slice(0,3);
  if(matches.length === 0) return '<div style="font-size:11px;color:var(--muted)">No match — try a different name</div>';
  var ctx = getMealContext();
  var isDinner = (ST.nutMealContext||ctx.id)==="dinner" || ST.nutMealContext==="pack";
  return '<div style="display:flex;flex-direction:column;gap:6px">' + matches.map(function(f){
    var calRem = Math.max(0, remaining);
    var pRem = Math.max(0, pLeft);
    var maxByCal = calRem > 0 ? Math.floor(calRem / (f.cal/100)) : 500;
    var gramsForProt = f.p > 0 ? Math.ceil(pRem / (f.p/100)) : null;
    var ideal = gramsForProt || maxByCal;
    var idealCal = Math.round(ideal * f.cal / 100);
    var idealP = Math.round(ideal * f.p / 100);
    var idealC = Math.round(ideal * f.c / 100);
    var overCal = idealCal > calRem;
    var highCarb = isDinner && idealC > 60;
    var alt = overCal ? maxByCal : null;
    var altCal = alt ? Math.round(alt * f.cal / 100) : 0;
    var altP = alt ? Math.round(alt * f.p / 100) : 0;
    return `<div style="background:var(--bg3);border-radius:var(--rs);padding:10px 12px;border:1px solid ${overCal?"rgba(249,115,22,.3)":highCarb?"rgba(234,179,8,.3)":"rgba(34,197,94,.2)"}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div style="font-weight:700;font-size:13px">${f.n}</div>
        <div style="font-family:var(--font-d);font-size:22px;color:${overCal?"var(--orange)":"var(--green)"}">${ideal}g</div>
      </div>
      <div style="font-size:11px;color:var(--muted)">${idealCal} kcal · +${idealP}g protein · ${idealC}g carbs · ${overCal?`<span style="color:var(--orange)">⚠ ${idealCal-calRem} kcal over</span>`:highCarb?`<span style="color:var(--yellow)">⚠ high carbs for evening</span>`:`<span style="color:var(--green)">fits ✓</span>`}</div>
      ${overCal && alt ? `<div style="font-size:11px;color:var(--muted);margin-top:3px">Stay in budget: <strong>${alt}g</strong> → ${altCal} kcal · +${altP}g protein</div>` : ""}
      ${highCarb && !overCal ? `<div style="font-size:11px;color:var(--yellow);margin-top:3px">Evening tip: consider halving to ${Math.round(ideal/2)}g → ${Math.round(idealCal/2)} kcal</div>` : ""}
    </div>`;
  }).join("") + "</div>";
}

              <button class="btn bg" style="flex:1;padding:4px;font-size:11px" data-day-steps="-250" data-day="${selectedDay}">-250</button>
              <button class="btn bp" style="flex:1;padding:4px;font-size:11px" data-day-steps="250" data-day="${selectedDay}">+250</button>
              <button class="btn bp" style="flex:1;padding:4px;font-size:11px" data-day-steps="500" data-day="${selectedDay}">+500</button>
            </div>
          </div>
        </div>
        <div style="background:var(--bg3);border-radius:var(--rs);padding:10px">
          <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">😴 Sleep</div>
          <div style="display:flex;align-items:center;gap:12px">
            <div style="font-family:var(--font-d);font-size:24px;color:#a78bfa;min-width:48px">${sl > 0 ? sl+"h" : "—"}</div>
            <div style="display:flex;gap:6px;flex:1">
              <button class="btn bg" style="flex:1;padding:8px 4px;font-size:12px" data-day-sleep="-0.25" data-day="${selectedDay}">-15m</button>
              <button class="btn bp" style="flex:1;padding:8px 4px;font-size:12px" data-day-sleep="0.25" data-day="${selectedDay}">+15m</button>
              <button class="btn bp" style="flex:1;padding:8px 4px;font-size:12px" data-day-sleep="1" data-day="${selectedDay}">+1h</button>
            </div>
          </div>
        </div>
      </div>`;
    })()}
    <!-- Macro bars for selected day -->
    ${[
      {label:"Calories",val:selSum.cal,target:TARGETS.cal,color:"#f97316",unit:"kcal"},
      {label:"Protein", val:ri(selSum.p),target:TARGETS.p, color:"#22c55e",unit:"g"},
      {label:"Carbs",   val:ri(selSum.c),target:TARGETS.c, color:"#4f8ef7",unit:"g"},
      {label:"Fat",     val:ri(selSum.f),target:TARGETS.f, color:"#eab308",unit:"g"},
    ].map(m=>{
      const pct=Math.min(100,(m.val/m.target)*100).toFixed(1);
      const over=m.val>m.target;
      return `<div class="pb-row"><div class="pb-label"><span class="pb-name" style="font-size:11px">${m.label}</span><span class="pb-val">${m.val}${m.unit} / ${m.target}${m.unit}</span></div><div class="pb-wrap"><div class="pb-fill" style="width:${pct}%;background:${over?"var(--red)":m.color}"></div></div></div>`;
    }).join("")}
    ${selEntries.length===0?
      `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">No food logged for this day</div>`:
      selEntries.map(e=>`<div class="food-item">
        <div class="food-dot" style="background:${e.p>30?"#22c55e":e.cal>400?"#f97316":"#4f8ef7"}"></div>
        <div class="food-info"><div class="food-name">${e.name}</div><div class="food-macros">${e.grams}g · ${e.cal} kcal · P:${ri(e.p)}g C:${ri(e.c)}g F:${ri(e.f)}g</div></div>
        <button style="background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px;font-family:var(--font-b)" data-edit-food="${e.id}">Edit</button>
        <button class="food-del" data-del-food="${e.id}">×</button>
      </div>`).join("")}
  </div>

  <!-- Protein streak -->
  <div class="card"><div class="ct">Protein Streak — hit ${TARGETS.p}g (14 days)</div>
    <div class="streak-row">${proteinStreak().map(d=>`<div class="streak-day${d.hit?" hit":d.logged?" miss":""}">${d.label}</div>`).join("")}</div>
  </div>`;
}

// ── FOOD MODAL ─────────────────────────────────────
function renderFoodModal() {
  const hasFood = !!ST.foodEntry.food;
  const hasGrams = !!ST.foodEntry.grams;
  let previewHTML = "";
  if(hasFood && hasGrams) {

      ${!ST.editingFood?`<button data-action="open-meal-builder" style="background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:var(--rs);padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-b)">🍽 Create Meal</button>`:""}
    </div>
    ${buildFoodModalInner()}
  </div></div>`;
}

function buildBelowSearch() {
  if(ST.foodLookingUp) {
    return `<div style="display:flex;align-items:center;gap:10px;padding:12px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);border-radius:var(--rs);margin-top:4px"><div style="width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0"></div><div style="font-size:13px;color:var(--purple)">Looking up macros…</div></div>`;
  }
  if(ST.foodResults.length > 0) {
    return `<div class="fsr" id="food-results-list">${ST.foodResults.map(f=>`<div class="fsr-item" data-sel-food='${JSON.stringify({n:f.n,cal:f.cal,p:f.p,c:f.c,f:f.f,cat:f.cat||"",serving_label:f.serving_label||"per 100g",serving_grams:f.serving_grams||100,food_type:f.food_type||"A"}).replace(/'/g,"&#39;")}'>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
        <div class="fsr-name">${f.n}</div>
        ${f.cat==="Claude Lookup"?`<span style="font-size:10px;background:rgba(168,85,247,.15);color:var(--purple);padding:2px 6px;border-radius:99px;font-weight:700">🤖 AI</span>`:""}
        ${f.cat==="Photo Lookup"?`<span style="font-size:10px;background:rgba(79,142,247,.15);color:var(--accent);padding:2px 6px;border-radius:99px;font-weight:700">📷 Photo</span>`:""}
      </div>
      <div class="fsr-macros">
        ${f.cat==="Claude Lookup" && f.food_type!=="A"
          ? `${f.serving_label}: ${Math.round(f.cal*(f.serving_grams||100)/100)} kcal · P:${Math.round(f.p*(f.serving_grams||100)/100*10)/10}g C:${Math.round(f.c*(f.serving_grams||100)/100*10)/10}g F:${Math.round(f.f*(f.serving_grams||100)/100*10)/10}g`
          : f.food_type==="E"
          ? `${f.cal} kcal · P:${ri(f.p)}g C:${ri(f.c)}g F:${ri(f.f)}g per 100ml`
          : `${f.cal} kcal · P:${ri(f.p)}g C:${ri(f.c)}g F:${ri(f.f)}g per 100g`}
      </div>
    </div>`).join("")}</div>`;
  }
  if(ST.foodSearch && ST.foodSearch.length >= 2) {
    return `<div style="padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-top:4px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Not in database — ask Claude to look it up?</div>
      <button id="ask-claude-btn" class="btn bpur bfull" style="font-size:13px;padding:10px">🤖 Ask Claude</button>
    </div>`;
  }
  return "";
}

function buildFoodModalInner() {
  var hasFood = !!ST.foodEntry.food;
  var hasGrams = !!(ST.foodEntry.grams && parseFloat(ST.foodEntry.grams) > 0);
  var previewHTML = "";
  if(hasFood && hasGrams) {
    var m = calcMacros(ST.foodEntry.food, ST.foodEntry.grams);
    previewHTML = `<div style="font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:8px">Calculated for ${ST.foodEntry.grams}g</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center"><div><div style="font-family:var(--font-d);font-size:22px;color:#f97316">${m.cal}</div><div style="font-size:10px;color:var(--muted)">kcal</div></div><div><div style="font-family:var(--font-d);font-size:22px;color:#22c55e">${m.p}</div><div style="font-size:10px;color:var(--muted)">protein</div></div><div><div style="font-family:var(--font-d);font-size:22px;color:#4f8ef7">${m.c}</div><div style="font-size:10px;color:var(--muted)">carbs</div></div><div><div style="font-family:var(--font-d);font-size:22px;color:#eab308">${m.f}</div><div style="font-size:10px;color:var(--muted)">fat</div></div></div>`;
  }

  // Determine what to show below search box
  var belowSearch = buildBelowSearch();

  // Breakdown mode — show editable component list
  if(ST.breakdown) {
    var bd = ST.breakdown;
    var bdTotal = bd.components.reduce(function(t,c){ return {cal:t.cal+c.cal, p:t.p+c.p, c:t.c+c.c, f:t.f+c.f}; }, {cal:0,p:0,c:0,f:0});
    var bdTotalG = bd.components.reduce(function(t,c){ return t+parseFloat(c.grams||0); }, 0);
    var bdSearchResults = bd.bdSearch && bd.bdSearch.length >= 1 ? searchFoods(bd.bdSearch) : [];

    return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <button id="bd-back-btn" style="background:none;border:none;color:var(--accent);font-size:20px;cursor:pointer;padding:0">←</button>
      <div>
        <div style="font-family:var(--font-d);font-size:20px;letter-spacing:1px">${bd.name}</div>
        <div style="font-size:11px;color:var(--muted)">Claude's estimate — adjust to match what you actually ate</div>
      </div>
    </div>

    <!-- Components list -->
    <div style="margin-bottom:12px">
      ${bd.components.map(function(c, i) {
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg3);border-radius:var(--rs);padding:8px 10px">
          <div style="flex:1">
            <div style="font-weight:600;font-size:13px">${c.name}</div>
            <div id="bd-macros-${i}" style="font-size:11px;color:var(--muted);margin-top:1px">${c.cal} kcal · P:${ri(c.p)}g C:${ri(c.c)}g F:${ri(c.f)}g</div>
          </div>
          <input type="number" inputmode="decimal" id="bd-grams-${i}" value="${c.grams}" style="width:58px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:5px;color:var(--text);font-size:13px;text-align:center">
          <div style="font-size:11px;color:var(--muted)">g</div>
          <button id="bd-del-${i}" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 4px">×</button>
        </div>`;
      }).join("")}
    </div>

    <!-- Add ingredient to breakdown -->
    <div style="margin-bottom:12px">
      <input class="finput" id="bd-search-input" placeholder="+ Add ingredient…" value="${bd.bdSearch||""}" autocomplete="off" style="margin-bottom:4px">
      <div id="bd-search-results">${bdSearchResults.length > 0 ? `<div class="fsr">${bdSearchResults.map(f=>`<div class="bd-add-item" data-bd-food='${JSON.stringify({name:f.n,cal100:f.cal,p100:f.p,c100:f.c,f100:f.f}).replace(/'/g,"&#39;")}' style="padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--border)"><div class="fsr-name">${f.n}</div><div class="fsr-macros">${f.cal} kcal per 100g</div></div>`).join("")}</div>` : bd.bdSearch && bd.bdSearch.length >= 2 ? `<div style="padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-top:4px"><div style="font-size:12px;color:var(--muted);margin-bottom:8px">Not in database — ask Claude?</div><button id="bd-ask-claude-btn" class="btn bpur bfull" style="font-size:12px;padding:8px">🤖 Ask Claude for "${bd.bdSearch}"</button></div>` : ""}</div>
    </div>

    <!-- Totals -->
    <div style="background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);border-radius:var(--rs);padding:12px;margin-bottom:14px" id="bd-totals">
      <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:8px">Total — ${Math.round(bdTotalG)}g</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;text-align:center">
        <div><div style="font-family:var(--font-d);font-size:20px;color:#f97316">${Math.round(bdTotal.cal)}</div><div style="font-size:10px;color:var(--muted)">kcal</div></div>
        <div><div style="font-family:var(--font-d);font-size:20px;color:#22c55e">${ri(bdTotal.p)}</div><div style="font-size:10px;color:var(--muted)">protein</div></div>
        <div><div style="font-family:var(--font-d);font-size:20px;color:#4f8ef7">${ri(bdTotal.c)}</div><div style="font-size:10px;color:var(--muted)">carbs</div></div>
        <div><div style="font-family:var(--font-d);font-size:20px;color:#eab308">${ri(bdTotal.f)}</div><div style="font-size:10px;color:var(--muted)">fat</div></div>

    <div style="display:flex;gap:8px">
      <button class="btn bp" style="flex:2" id="bd-log-btn">Log This Meal</button>
      <button class="btn bg" style="flex:1;font-size:12px" id="bd-save-btn">💾 Save</button>
    </div>`;
  }

  return `
    ${ST.photoLookingUp ? `
    <div style="display:flex;align-items:center;gap:12px;padding:16px;background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.3);border-radius:var(--rs);margin-bottom:12px">
      <div style="width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0"></div>
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--accent)">Analyzing photo…</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Claude is identifying the food and estimating macros</div>
      </div>
    </div>` : `
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:700;color:var(--accent)">
        <input type="file" accept="image/*" capture id="food-photo-camera" style="display:none">📷 Take Photo
      </label>
      <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)">
        <input type="file" accept="image/*" id="food-photo-library" style="display:none">🖼 Library
      </label>
    </div>`}
    <div class="fgrp">
      <label class="flbl">Search Food</label>
      <input class="finput" type="text" id="food-search-input" placeholder="e.g. chicken breast, ceviche, pad thai…" value="${ST.foodSearch}" autocomplete="off">
      <div id="food-below-search">${belowSearch}</div>
    </div>
    ${hasFood?`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:14px">
      <div style="font-weight:700;font-size:14px;margin-bottom:3px">✓ ${ST.foodEntry.food.n}${ST.foodEntry.food.cat==="Claude Lookup"?' <span style="font-size:10px;background:rgba(168,85,247,.15);color:var(--purple);padding:2px 6px;border-radius:99px;font-weight:700">🤖 AI</span>':""}</div>
      <div style="font-size:12px;color:var(--muted)">
        ${ST.foodEntry.food.cat==="Claude Lookup" && ST.foodEntry.food.food_type !== "A"
          ? `Typical serving: ${ST.foodEntry.food.serving_label} (~${ST.foodEntry.food.serving_grams}g) · ${Math.round(ST.foodEntry.food.cal*(ST.foodEntry.food.serving_grams)/100)} kcal`
          : `${ST.foodEntry.food.cal} kcal · P:${ri(ST.foodEntry.food.p)}g · C:${ri(ST.foodEntry.food.c)}g · F:${ri(ST.foodEntry.food.f)}g per 100g`
        }
      </div>
    </div>
    <div class="fgrp">
      ${(()=>{
        var isLiquid = ST.foodEntry.food && (
          ST.foodEntry.food.food_type === "E" ||
          ["milk","juice","shake","smoothie","drink","coffee","water","coconut","latte","cappuccino","espresso"].some(function(w){ return ST.foodEntry.food.n.toLowerCase().includes(w); })
        );
        var isClaudeServing = ST.foodEntry.food && ST.foodEntry.food.cat==="Claude Lookup" && ST.foodEntry.food.food_type!=="A";
        var lbl = isClaudeServing ? `Amount (grams) — typical serving: ${ST.foodEntry.food.serving_grams}g` : isLiquid ? "Amount (ml) — 1ml ≈ 1g for liquids" : "Amount (grams)";
        var placeholder = ST.foodEntry.food && ST.foodEntry.food.serving_grams ? String(ST.foodEntry.food.serving_grams) : isLiquid ? "240" : "150";
        var qs = getQuickServings(ST.foodEntry.food ? ST.foodEntry.food.n : "");
        return `<label class="flbl">${lbl}</label>
        ${qs ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
          ${qs.map(function(s){
            var m = calcMacros(ST.foodEntry.food, s.g);
            var active = String(ST.foodEntry.grams) === String(s.g);
            return `<button class="quick-serving-btn" data-qg="${s.g}" style="padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-b);border:1px solid ${active?"var(--accent)":"var(--border)"};background:${active?"rgba(79,142,247,.15)":"var(--bg3)"};color:${active?"var(--accent)":"var(--muted)"}">
              ${s.label} <span style="font-weight:400;color:var(--muted)">(${s.g}${isLiquid?"ml":"g"} · ${m.cal}kcal)</span>
            </button>`;
          }).join("")}
        </div>` : ""}
        <input class="finput" type="number" inputmode="decimal" id="food-grams-input" placeholder="${placeholder}" value="${ST.foodEntry.grams}" autocomplete="off">`;
      })()}
    </div>
    <div id="macro-preview" style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:var(--rs);padding:12px;margin-bottom:14px;${hasGrams?"":"display:none"}">${previewHTML}</div>
    <button id="save-food-btn" class="btn bp bfull blg" style="${hasGrams?"":"display:none"}">${ST.editingFood?"Update Entry":"Add to Log"}</button>
    `:`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">Search for a food above.<br>${FOODS.length} foods in database + Claude AI lookup.</div>`}`;
}

// ── CHEAT SHEET ────────────────────────────────────
function buildCSTableHTML() {
  const q = (ST.csSearch||"").toLowerCase();
  const filtered = FOODS.filter(f => {
    const catOk = ST.csFilter==="All" || f.cat===ST.csFilter || (f.cuisine||[]).includes(ST.csFilter);
    return catOk && (!q || f.n.toLowerCase().includes(q));
  });
  if(!filtered.length) return `<div class="cs-thead"><div>Food</div><div style="text-align:right">Cal</div><div style="text-align:right">P</div><div style="text-align:right">C</div><div style="text-align:right">F</div></div><div style="padding:20px;text-align:center;color:var(--muted)">No foods found</div>`;
  return `<div class="cs-thead"><div>Food</div><div style="text-align:right">Cal</div><div style="text-align:right">P</div><div style="text-align:right">C</div><div style="text-align:right">F</div></div>` +
    filtered.map(f => {
      const exp = ST.csExpanded === f.n;
      const s50=calcMacros(f,50), s100=calcMacros(f,100), s150=calcMacros(f,150), s200=calcMacros(f,200);
      return `<div class="cs-row${exp?" expanded":""}" data-cs-exp="${f.n}">
        <div><div class="cs-fname">${f.n}</div><div class="cs-cat">${f.cat}</div></div>
        <div class="cs-num" style="color:#f97316">${f.cal}</div>
        <div class="cs-num" style="color:#22c55e">${ri(f.p)}g</div>
        <div class="cs-num" style="color:#4f8ef7">${ri(f.c)}g</div>
        <div class="cs-num" style="color:#eab308">${ri(f.f)}g</div>
      </div>
      ${exp?`<div class="cs-detail">
        <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Serving Sizes</div>
        <div class="cs-serving">
          <div class="cs-sv-item"><div class="cs-sv-label">50g</div><div class="cs-sv-macros">${s50.cal} kcal · P:${ri(s50.p)}g C:${ri(s50.c)}g F:${ri(s50.f)}g</div></div>
          <div class="cs-sv-item"><div class="cs-sv-label">100g</div><div class="cs-sv-macros">${s100.cal} kcal · P:${ri(s100.p)}g C:${ri(s100.c)}g F:${ri(s100.f)}g</div></div>
          <div class="cs-sv-item"><div class="cs-sv-label">150g</div><div class="cs-sv-macros">${s150.cal} kcal · P:${ri(s150.p)}g C:${ri(s150.c)}g F:${ri(s150.f)}g</div></div>

function getBDTotal() {
  if(!ST.breakdown) return {cal:0,p:0,c:0,f:0};
  return ST.breakdown.components.reduce(function(t,c){ return {cal:t.cal+c.cal, p:t.p+c.p, c:t.c+c.c, f:t.f+c.f}; }, {cal:0,p:0,c:0,f:0});
}
function getBDTotalG() {
  if(!ST.breakdown) return 100;
  return Math.max(1, ST.breakdown.components.reduce(function(t,c){ return t+parseFloat(c.grams||0); }, 0));
}
function updateBDTotals() {
  var tot = getBDTotal(), totalG = getBDTotalG();
  var el = document.getElementById("bd-totals");
  if(el) {
    el.innerHTML = `<div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:8px">Total — ${Math.round(totalG)}g</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;text-align:center">
        <div><div style="font-family:var(--font-d);font-size:20px;color:#f97316">${Math.round(tot.cal)}</div><div style="font-size:10px;color:var(--muted)">kcal</div></div>
        <div><div style="font-family:var(--font-d);font-size:20px;color:#22c55e">${ri(tot.p)}</div><div style="font-size:10px;color:var(--muted)">protein</div></div>
        <div><div style="font-family:var(--font-d);font-size:20px;color:#4f8ef7">${ri(tot.c)}</div><div style="font-size:10px;color:var(--muted)">carbs</div></div>
        <div><div style="font-family:var(--font-d);font-size:20px;color:#eab308">${ri(tot.f)}</div><div style="font-size:10px;color:var(--muted)">fat</div></div>
      </div>`;
  }
}
function addBDIngredient(dataStr) {
  try {
    var f = JSON.parse(dataStr.replace(/&#39;/g,"'"));
    var grams = 100;
    ST.breakdown.components.push({
      name: f.name, grams: grams,
      cal: Math.round(f.cal100*grams/100), p: Math.round(f.p100*grams/100*10)/10,
      c: Math.round(f.c100*grams/100*10)/10, f: Math.round(f.f100*grams/100*10)/10,
      _cal100: f.cal100, _p100: f.p100, _c100: f.c100, _f100: f.f100
    });
    ST.breakdown.bdSearch = "";
    var modal = document.querySelector(".modal");
    if(modal) { modal.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }
    // Focus new grams input
    requestAnimationFrame(function(){
      setTimeout(function(){
        var inputs = document.querySelectorAll("[id^='bd-grams-']");
        if(inputs.length) { var last=inputs[inputs.length-1]; last.focus(); last.select(); }
      }, 100);
    });
  } catch(e) { console.log("addBDIngredient error:", e); }
}

function attachStatEntryListeners(container, id) {
  // Expand/collapse toggle — surgical, no render()
  var expEl = container.querySelector("[data-exp-stat]");
  if(expEl) expEl.addEventListener("click", function(e){
    // Ignore clicks on action buttons inside the expanded panel
    if(e.target.closest("[data-edit-stat],[data-del-stat],[data-del-photo-idx],[data-view-photo],[data-photo-stat],label,button")) return;
    e.stopPropagation();
    ST.expandedStat = (ST.expandedStat===id) ? null : id;
    var s = ST.bodyStats.find(function(x){return x.id===id;});
    if(!s) return;
    var isExp = ST.expandedStat===id;
    container.innerHTML = buildStatEntryHTML(s, isExp, !!s.photo_path, ST.photoUploading===id);
    attachStatEntryListeners(container, id);
  });
  // View photo
  var vpEl = container.querySelector("[data-view-photo]");
  if(vpEl) vpEl.addEventListener("click", function(e){
    e.stopPropagation();
    ST.viewingPhoto = vpEl.dataset.viewPhoto;
    render();
  });
  // Photo upload — appends to photos array
  container.querySelectorAll("[data-photo-stat]").forEach(function(el){
    el.addEventListener("change", function(){
      var file = el.files[0]; if(!file) return;
      var statId = el.dataset.photoStat;
      ST.photoUploading = statId;
      var stat0 = ST.bodyStats.find(function(x){return x.id===statId;});
      container.innerHTML = buildStatEntryHTML(stat0||{id:statId}, true, false, true);
      attachStatEntryListeners(container, statId);
      sbUploadPhoto(statId, file).then(function(path){
        if(path){
          var stat = ST.bodyStats.find(function(x){return x.id===statId;});
          if(stat){
            var photos = getPhotos(stat);
            photos.push(path);
            setPhotos(stat, photos);
            saveBodyStat(stat);
          }
        }
        ST.photoUploading = null;
        var s2 = ST.bodyStats.find(function(x){return x.id===statId;});
        if(s2){ container.innerHTML=buildStatEntryHTML(s2,true,getPhotos(s2).length>0,false); attachStatEntryListeners(container,statId); }
      });
    });
  });

  // Delete individual photo by index
  container.querySelectorAll("[data-del-photo-idx]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = parseInt(btn.dataset.delPhotoIdx);
      var statId = btn.dataset.delPhotoStat;
      var stat = ST.bodyStats.find(function(x){return x.id===statId;});
      if(!stat) return;
      var photos = getPhotos(stat);
      var removed = photos.splice(idx, 1);
      if(removed[0]) sbDeletePhoto(removed[0]);
      setPhotos(stat, photos);
      saveBodyStat(stat);
      container.innerHTML = buildStatEntryHTML(stat, true, photos.length>0, false);
      attachStatEntryListeners(container, statId);
    });
  });
  // Edit stat
  var editEl = container.querySelector("[data-edit-stat]");
  if(editEl) editEl.addEventListener("click", function(e){
    e.stopPropagation();
    var stat = ST.bodyStats.find(function(x){return x.id===editEl.dataset.editStat;});
    if(stat){ ST.editingStat=stat; ST.showBodyModal=true; render(); }
  });
  // Delete stat
  var delEl = container.querySelector("[data-del-stat]");
  if(delEl) delEl.addEventListener("click", function(e){
    e.stopPropagation();
    if(!confirm("Delete this entry?")) return;
    var statId=delEl.dataset.delStat;
    ST.bodyStats=ST.bodyStats.filter(function(x){return x.id!==statId;});
    save(); sbDelete("body_stats",statId); render();
  });
}
