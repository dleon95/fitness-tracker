<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Diego's Fitness Tracker</title>


<style>
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;
  --border:#2a2a3a;--text:#f0f0f8;--muted:#6b6b88;--muted2:#9090aa;
  --accent:#4f8ef7;--green:#22c55e;--red:#ef4444;--orange:#f97316;
  --yellow:#eab308;--teal:#06b6d4;--purple:#a855f7;
  --font-d:'Arial Black',Arial,sans-serif;--font-b:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-b);height:100%;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:100px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
/* NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(18,18,26,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 max(16px,env(safe-area-inset-bottom));z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0;transition:color .2s;font-family:var(--font-b)}
.nb.active{color:var(--accent)}
.ni{font-size:17px;line-height:1;width:40px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:99px;transition:background .2s}
.nb.active .ni{background:rgba(79,142,247,.18)}
.nl{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
/* HEADERS */
.ph{padding:52px 20px 14px;position:sticky;top:0;background:rgba(10,10,15,.97);backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid var(--border)}
.pt{font-family:var(--font-d);font-size:28px;letter-spacing:1px;line-height:1}
.ps{font-size:12px;color:var(--muted);margin-top:3px}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 16px 12px}
.ct{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sv{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;line-height:1}
.su{font-size:11px;color:var(--muted);margin-top:2px}
.sd{font-size:11px;font-weight:600;margin-top:4px}
.dg{color:var(--green)}.db{color:var(--red)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:var(--rs);font-family:var(--font-b);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.bp{background:var(--accent);color:#fff}.bp:active{transform:scale(.97);opacity:.9}
.bg{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.bs{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.bd{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.bpur{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.bfull{width:100%}.blg{padding:15px 24px;font-size:15px;border-radius:var(--r)}
/* PROGRESS BAR */
.pb-wrap{background:var(--bg3);border-radius:99px;height:8px;overflow:hidden;margin-top:5px}
.pb-fill{height:100%;border-radius:99px;transition:width .6s ease}
.pb-row{margin-bottom:11px}
.pb-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.pb-name{font-weight:600}.pb-val{color:var(--muted)}
/* EXERCISE BLOCKS */
.exb{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.exh{padding:12px 14px 10px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.exnum{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px}
.exnum.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--green)}
.exinfo{flex:1}.exname{font-weight:700;font-size:14px;line-height:1.2}
.exspec{font-size:11px;color:var(--muted);margin-top:3px}
.exarr{color:var(--muted);font-size:18px;align-self:center;transition:transform .2s}
.exarr.open{transform:rotate(180deg)}
/* FORM GUIDE */
.fguide{margin:0 14px 10px;border-radius:var(--rs);background:var(--bg3);border:1px solid var(--border)}
.fg-body{padding:12px 14px}
.fg-sec{margin-bottom:10px}
.fg-ttl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.fg-step{display:flex;gap:8px;margin-bottom:5px;font-size:12px;line-height:1.5;color:var(--muted2)}
.fg-snum{width:18px;height:18px;border-radius:50%;background:rgba(79,142,247,.15);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.fg-err{display:flex;gap:8px;margin-bottom:5px;font-size:12px;line-height:1.5;color:var(--muted2)}
.fg-x{color:var(--red);font-size:14px;flex-shrink:0}
.fg-tip{background:rgba(234,179,8,.08);border-left:3px solid var(--yellow);border-radius:0 var(--rs) var(--rs) 0;padding:8px 10px;font-size:12px;line-height:1.5;margin-top:4px}
/* SETS */
.sets-area{padding:0 14px 14px}
.sets-hdr{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:8px;margin-bottom:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 2px}
.set-row{display:grid;grid-template-columns:32px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.snum{width:32px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
.snum.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--green)}
.sinput{height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font-b);font-size:15px;font-weight:600;text-align:center;width:100%;-webkit-appearance:none;transition:border-color .15s}
.sinput:focus{outline:none;border-color:var(--accent)}
.sinput::placeholder{color:var(--muted);font-size:12px}
.schk{width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s}
.schk.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4)}
.schk:active{transform:scale(.92)}
.add-set{width:100%;padding:8px;background:none;border:1px dashed var(--border);border-radius:var(--rs);color:var(--muted);font-family:var(--font-b);font-size:12px;font-weight:600;cursor:pointer;margin-top:2px}
/* WORKOUT ACTION BAR - fixed at bottom above nav */
.wact{padding:14px 16px;display:flex;gap:10px;position:fixed;bottom:calc(68px + max(16px,env(safe-area-inset-bottom)));left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,10,15,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:20}
/* REST TIMER */
.rtimer{position:fixed;bottom:calc(120px + max(6px,env(safe-area-inset-bottom)));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:var(--bg3);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 8px 32px rgba(79,142,247,.25);animation:sup .25s ease}
@keyframes sup{from{transform:translateX(-50%) translateY(20px);opacity:0}}
.rt-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.rt-count{font-family:var(--font-d);font-size:30px;letter-spacing:1px;flex:1}
.rt-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
.rt-bar{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);border-radius:0 0 var(--r) var(--r);transition:width 1s linear}
/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(4px);animation:fi .2s ease}
@keyframes fi{from{opacity:0}}
.modal{width:100%;max-width:480px;margin:0 auto;background:var(--bg2);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--border);border-bottom:none;padding:20px 20px max(20px,env(safe-area-inset-bottom));animation:su2 .25s ease;max-height:92dvh;overflow-y:auto}
@keyframes su2{from{transform:translateY(100%)}}
.mhandle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 18px}
.mtitle{font-family:var(--font-d);font-size:26px;letter-spacing:1px;margin-bottom:16px}
/* FORMS */
.fgrp{margin-bottom:14px}
.flbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.finput{width:100%;height:44px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font-b);font-size:16px;padding:0 12px;transition:border-color .15s}
.finput:focus{outline:none;border-color:var(--accent)}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* FOOD */
.food-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.food-item:last-child{border-bottom:none}
.food-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.food-info{flex:1}
.food-name{font-weight:600;font-size:13px}
.food-macros{font-size:11px;color:var(--muted);margin-top:2px}
.food-del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
/* FOOD SEARCH RESULTS */
.fsr{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);margin-top:4px;max-height:200px;overflow-y:auto}
.fsr-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.fsr-item:last-child{border-bottom:none}
.fsr-item:active{background:var(--bg4)}
.fsr-name{font-weight:600;font-size:13px}
.fsr-macros{font-size:11px;color:var(--muted);margin-top:2px}
/* WATER */
.water-track{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px 0}
.water-drop{font-size:26px;transition:all .15s;filter:grayscale(1);opacity:.3}
.water-drop.filled{filter:none;opacity:1}
/* STREAK */
.streak-row{display:flex;gap:5px;justify-content:center;padding:8px 0;flex-wrap:wrap}
.streak-day{width:30px;height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.streak-day.hit{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:var(--green)}
.streak-day.miss{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.2);color:var(--red)}
/* HISTORY */
.log-item{margin:0 16px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer}
.log-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px}
.log-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.log-info{flex:1}
.log-title{font-weight:700;font-size:14px}
.log-date{font-size:12px;color:var(--muted);margin-top:2px}
.log-stats{display:flex;gap:14px;padding:8px 14px;background:var(--bg3);border-top:1px solid var(--border)}
.log-stat{font-size:12px;color:var(--muted)}
.log-stat strong{color:var(--text);font-weight:600}
.log-detail{padding:12px 14px;border-top:1px solid var(--border)}
.log-ex{font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)}
.log-ex:last-child{border-bottom:none}
.log-ex-name{font-weight:600;margin-bottom:2px}
.log-ex-sets{color:var(--muted)}
/* PR */
.pr-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.pr-item:last-child{border-bottom:none}
.pr-rank{font-family:var(--font-d);font-size:22px;color:var(--muted);width:32px}
.pr-info{flex:1}
.pr-name{font-weight:600;font-size:14px}
.pr-date{font-size:11px;color:var(--muted);margin-top:2px}
.pr-wt{text-align:right}
.pr-lbs{font-family:var(--font-d);font-size:26px;letter-spacing:.5px}
.pr-unit{font-size:11px;color:var(--muted)}
/* DAY CARD */
.daycard{margin:0 16px 10px;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;cursor:pointer;background:var(--bg2);transition:transform .15s}
.daycard:active{transform:scale(.98)}
.dc-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px}
.dc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dc-title{font-weight:700;font-size:15px;flex:1}
.dc-meta{font-size:12px;color:var(--muted)}
.dc-muscles{font-size:11px;color:var(--muted);padding:0 16px 10px}
.dc-foot{padding:10px 16px;background:var(--bg3);display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border)}
/* WELCOME */
.wbanner{margin:16px 16px 12px;background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(124,92,252,.15));border:1px solid rgba(79,142,247,.25);border-radius:var(--r);padding:18px}
.wname{font-family:var(--font-d);font-size:36px;letter-spacing:1px;line-height:1}
.wsub{font-size:13px;color:var(--muted);margin-top:6px}
/* RINGS */
.wrings{display:flex;gap:8px;justify-content:center;margin:14px 0 8px}
.rwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.rlabel{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.rsvg{width:40px;height:40px}
.rbg{fill:none;stroke:var(--bg3);stroke-width:4}
.rprog{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:20px 20px;transition:stroke-dashoffset .6s ease}
.rday{font-size:10px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:central}
/* CHEAT SHEET */
.cs-filter{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 12px}
.cs-filter::-webkit-scrollbar{display:none}
.cs-pill{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.cs-pill.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}
.cs-search{margin:12px 16px 0;position:relative}
.cs-search input{width:100%;height:42px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--font-b);font-size:15px;padding:0 12px 0 36px}
.cs-search input:focus{outline:none;border-color:var(--accent)}
.cs-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.cs-table{margin:10px 16px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cs-thead{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);gap:4px}
.cs-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;padding:10px 12px;border-bottom:1px solid var(--border);gap:4px;align-items:center;cursor:pointer;transition:background .15s;user-select:none}
.cs-row:last-child{border-bottom:none}
.cs-row:active{background:var(--bg3)}
.cs-row.expanded{background:rgba(79,142,247,.05)}
.cs-fname{font-weight:600;font-size:13px}
.cs-cat{font-size:10px;color:var(--muted);margin-top:2px}
.cs-num{font-size:13px;font-weight:600;text-align:right}
.cs-detail{background:var(--bg3);border-bottom:1px solid var(--border);padding:12px 14px;font-size:12px;color:var(--muted2);line-height:1.6}
.cs-serving{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cs-sv-item{background:var(--bg2);border-radius:var(--rs);padding:8px 10px}
.cs-sv-label{color:var(--muted);margin-bottom:3px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.cs-sv-macros{font-weight:600;color:var(--text);font-size:12px}
/* TAB PILLS */
.tab-pills{display:flex;gap:8px;margin:12px 16px;overflow-x:auto;scrollbar-width:none}
.tab-pills::-webkit-scrollbar{display:none}
.tab-pill{flex-shrink:0;padding:7px 16px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;background:var(--bg3);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tab-pill.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent)}
/* AI */
.ai-banner{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(79,142,247,.2));border:1px solid rgba(168,85,247,.3);border-radius:var(--r);padding:18px;margin:0 16px 12px}
.ai-report{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:0 16px 12px;font-size:13px;line-height:1.7;color:var(--muted2)}
.ai-report h3{color:var(--text);font-family:var(--font-d);font-size:18px;letter-spacing:.5px;margin:12px 0 6px}
.ai-report h3:first-child{margin-top:0}
.ai-report strong{color:var(--text)}
.ai-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* MISC */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.pill-a{background:rgba(79,142,247,.15);color:var(--accent)}
.chart-wrap{position:relative;height:190px;margin-top:10px}
</style>
</head>

// ── Supabase Storage (progress photos) ──────────────
async function sbUploadPhoto(statId, file) {
  var ext = "jpg";
  if(file.type === "image/png") ext = "png";
  var path = "photo_" + statId + "_" + Date.now() + "." + ext;
  console.log("Uploading photo:", path, "type:", file.type, "size:", file.size);
  try {
    var resp = await fetch(SUPA_URL + "/storage/v1/object/progress-photos/" + path, {
      method: "POST",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY,
        "Content-Type": "image/jpeg",
        "x-upsert": "true"
      },
      body: file
    });
    var respText = await resp.text();
    console.log("Upload response:", resp.status, respText);
    if(resp.ok) return path;
    alert("Photo upload failed: " + resp.status + " " + respText.slice(0,100));
    return null;
  } catch(e) {
    console.error("Upload error:", e);
    alert("Photo upload error: " + e.message);
    return null;
  }
}

async function sbDeletePhoto(path) {
  await fetch(SUPA_URL + "/storage/v1/object/progress-photos/" + path, {
    method: "DELETE",
    headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY }
  });
}

function sbPhotoUrl(path) {
  if(!path) return "";
  var cleanPath = path.replace(/^progress-photos\/?/, "");
  return SUPA_URL + "/storage/v1/object/public/progress-photos/" + cleanPath;
}

// Photo array helpers — photo_path stored as JSON array string in Supabase
function getPhotos(stat) {
  if(!stat.photo_path) return [];
  try {
    var parsed = JSON.parse(stat.photo_path);
    return Array.isArray(parsed) ? parsed : [stat.photo_path]; // handle legacy single string
  } catch(e) {
    return stat.photo_path ? [stat.photo_path] : []; // legacy single string
  }
}

function setPhotos(stat, photos) {
  stat.photo_path = photos.length > 0 ? JSON.stringify(photos) : null;
}

};

}

function fmtDate(iso) { return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function today()      { return new Date().toISOString().split("T")[0]; }
function getToday()   { return new Date().toLocaleDateString("en-US",{weekday:"short"}).toUpperCase().slice(0,3); }
function weekMon()    { var d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); d.setHours(0,0,0,0); return d; }
function weekLogs()   { var m=weekMon(); return ST.workoutLogs.filter(function(l){return new Date(l.date+"T12:00:00")>=m;}); }
function getLean(w,bf){ return bf ? +(w*(1-bf/100)).toFixed(1) : null; }
function daysAgo(iso) { return Math.round((Date.now()-new Date(iso+"T12:00:00"))/(86400000)); }
function weekNum()    { var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7); var w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7); }
function nutByDate(date) { return ST.nutritionLogs.filter(function(l){return l.date===date&&l.type==="food";}); }
function nutSum(entries)  { return entries.reduce(function(a,e){return {cal:a.cal+(e.cal||0),p:a.p+(e.p||0),c:a.c+(e.c||0),f:a.f+(e.f||0)};},{cal:0,p:0,c:0,f:0}); }
function todayWater()     { var l=ST.nutritionLogs.find(function(l){return l.date===today()&&l.type==="water";}); return l?l.liters:0; }
function calcMacros(food,grams) { var g=parseFloat(grams)||0,r=g/100; return {cal:Math.round(food.cal*r),p:Math.round(food.p*r),c:Math.round(food.c*r),f:Math.round(food.f*r)}; }
function ri(v) { return Math.round(parseFloat(v)||0); } // round to integer for display
function searchFoods(q) {
  if(!q || q.length < 1) return [];
  var ql = q.toLowerCase();
  // Search custom foods first (user's saved Claude lookups)
  var custom = ST.customFoods.filter(function(f){ return f.n.toLowerCase().indexOf(ql) >= 0; });
  // Then built-in database
  var builtin = FOODS.filter(function(f){ return f.n.toLowerCase().indexOf(ql) >= 0; });
  // Combine, dedupe by name, limit to 8
  var seen = {};
  var results = [];
  custom.concat(builtin).forEach(function(f){
    if(!seen[f.n]) { seen[f.n] = true; results.push(f); }
  });
  return results.slice(0, 8);
}

function saveCustomFood(food_entry, source) {
  // Don't save if already in built-in database
  var inDB = FOODS.some(function(f){ return f.n.toLowerCase() === food_entry.n.toLowerCase(); });
  if(inDB) return;
  food_entry.source = source || food_entry.source || "claude"; // "claude" or "manual"
  if(!food_entry.id) food_entry.id = food_entry.n.replace(/\s+/g,"_").toLowerCase() + "_" + Date.now();
  var exists = ST.customFoods.some(function(f){ return f.n.toLowerCase() === food_entry.n.toLowerCase(); });
  if(exists) {
    var idx = ST.customFoods.findIndex(function(f){ return f.n.toLowerCase() === food_entry.n.toLowerCase(); });
    if(idx >= 0) ST.customFoods[idx] = food_entry;
  } else {
    ST.customFoods.unshift(food_entry);
  }
  save();
  saveCustomFoodToCloud(food_entry);
}

async function lookupFoodWithClaude(query) {
  ST.foodLookingUp = true;
  var modalEl = document.querySelector(".modal");
  if(modalEl) { modalEl.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }

  try {
    var resp = await fetch("https://fitness-proxy.leonsilvadiego.workers.dev", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 300,
        messages: [{
          role: "user",
          content: `Look up the nutrition info for: "${query}"

Determine what TYPE of food this is and respond accordingly:

TYPE A — Raw ingredient (chicken breast, rice, oats, olive oil, etc.):
Return macros per 100g. Set serving_label to "per 100g" and serving_grams to 100.

TYPE B — Restaurant/fast food item (Big Mac, Wendy's sandwich, Chipotle burrito, etc.):
Return macros for the WHOLE item as typically served. Set serving_label to the item description (e.g. "1 sandwich", "1 burger") and serving_grams to the approximate weight of that item in grams.

TYPE C — Recipe/dish (lomo saltado, pad thai, chicken tikka masala, etc.):
Return macros for a typical restaurant/home serving portion. Set serving_label (e.g. "1 serving ~350g") and serving_grams to the typical serving weight.

TYPE D — Combo meal (Wendy's combo, McDonald's meal, etc.):
Return macros for the full combo as typically ordered. Set serving_label (e.g. "full combo meal") and serving_grams to approximate total weight.

Respond with ONLY a JSON object, no other text:
{"name":"exact food name","cal":000,"p":00.0,"c":00.0,"f":00.0,"serving_label":"description","serving_grams":000,"type":"A|B|C|D"}

Use real nutritional data. For restaurant items use the actual menu item nutrition if known.`
        }]
      })
    });
    var rawText = await resp.text();
    console.log("Worker status:", resp.status);
    if(!resp.ok) { throw new Error("Worker error " + resp.status); }
    var json = JSON.parse(rawText);
    var text = (json.content && json.content[0] && json.content[0].text) || "";
    var match = text.match(/\{[\s\S]*\}/);
    if(match) {
      var food = JSON.parse(match[0]);
      if(food.name && food.cal !== undefined && food.p !== undefined) {
        // For non-raw items, normalize macros to per-100g equivalent for our calcMacros system
        // but store the serving info so we can pre-fill grams and show the label
        var sg = food.serving_grams || 100;
        var food_entry = {
          n:    food.name,
          cal:  Math.round((food.cal / sg) * 100),
          p:    Math.round((food.p  / sg) * 100 * 10) / 10,
          c:    Math.round((food.c  / sg) * 100 * 10) / 10,
          f:    Math.round((food.f  / sg) * 100 * 10) / 10,
          cat:  "Claude Lookup",
          serving_label: food.serving_label || "per 100g",
          serving_grams: sg,
          food_type: food.type || "A"
        };
        ST.foodLookingUp = false;
        ST.foodResults = [food_entry];
        // Auto-save to custom foods list so it appears in future searches
        saveCustomFood(food_entry);
        // Pre-fill grams with the natural serving size
        ST.pendingServingGrams = sg;
        var modalEl2 = document.querySelector(".modal");
        if(modalEl2) {
          modalEl2.innerHTML = buildFoodModalInner();
          attachFoodModalInner();
          var ni = document.getElementById("food-search-input");
          if(ni){ni.focus();ni.setSelectionRange(ni.value.length,ni.value.length);}
        }
        return;
      }
    }
  } catch(e) { console.log("Lookup error:", e); }

  ST.foodLookingUp = false;
  ST.foodResults = [];
  var modalEl3 = document.querySelector(".modal");
  if(modalEl3) { modalEl3.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }
}

// Get last N sessions for a specific exercise
function getExHistory(exId, exName, n) {
  var history = [];
  for(var i = 0; i < ST.workoutLogs.length && history.length < n; i++) {
    var log = ST.workoutLogs[i];
    var ex = (log.exercises||[]).find(function(e){ return e.id===exId || e.name===exName; });
    if(ex) {
      var doneSets = (ex.sets||[]).filter(function(s){ return s.weight||s.reps; });
      if(doneSets.length > 0) {
        var maxW = Math.max.apply(null, doneSets.map(function(s){ return parseFloat(s.weight)||0; }));
        var maxSet = doneSets.find(function(s){ return parseFloat(s.weight)===maxW; }) || doneSets[0];
        history.push({ date: log.date, maxWeight: maxW, maxReps: parseFloat(maxSet.reps)||0, totalSets: doneSets.length, allSets: doneSets });
      }
    }
  }
  return history; // most recent first
}

function getLastExSession(exId, exName) {
  var h = getExHistory(exId, exName, 1);
  return h.length > 0 ? h[0] : null;
}

function getProgressionIncrement(exId, trainingWeeks) {
  // Exercise-specific increments based on muscle size and movement type
  const increments = {
    // Big compound lower — largest muscles, fastest progression
    back_squat:   {inc:10, slowInc:5},
    hip_thrust:   {inc:10, slowInc:5},
    rdl_mon:      {inc:5,  slowInc:5},
    rdl_thu:      {inc:5,  slowInc:5},
    rdl_sat:      {inc:5,  slowInc:5},
    leg_press:    {inc:10, slowInc:5},
    lunge:        {inc:5,  slowInc:2.5},
    bulgarian:    {inc:5,  slowInc:2.5},
    goblet:       {inc:5,  slowInc:2.5},
    db_rdl:       {inc:5,  slowInc:2.5},
    sl_rdl:       {inc:5,  slowInc:2.5},
    // Big compound upper
    bench:        {inc:5,  slowInc:2.5},
    ohp:          {inc:5,  slowInc:2.5},
    bb_row:       {inc:5,  slowInc:2.5},
    pullup:       {inc:1,  slowInc:1,  unit:"rep"}, // bodyweight — add reps
    cable_row:    {inc:5,  slowInc:2.5},
    lat_pull:     {inc:5,  slowInc:2.5},
    db_row:       {inc:5,  slowInc:2.5},
    chest_row:    {inc:5,  slowInc:2.5},
    incline_db:   {inc:5,  slowInc:2.5},
    // Isolation — small muscles, progress slowly
    ez_curl:      {inc:2.5, slowInc:2.5},
    hammer:       {inc:2.5, slowInc:2.5},
    incline_curl: {inc:2.5, slowInc:2.5},
    tri_push:     {inc:2.5, slowInc:2.5},
    oh_tri:       {inc:2.5, slowInc:2.5},
    ez_super:     {inc:2.5, slowInc:2.5},
    cable_super:  {inc:2.5, slowInc:2.5},
    lat_raise:    {inc:2.5, slowInc:2.5},
    lat_fin:      {inc:2.5, slowInc:2.5},
    face_pull_t:  {inc:2.5, slowInc:2.5},
    face_pull_f:  {inc:2.5, slowInc:2.5},
    cable_fly:    {inc:2.5, slowInc:2.5},
    cable_crunch: {inc:5,   slowInc:2.5},
    cable_through:{inc:5,   slowInc:5},
    pull_thru:    {inc:5,   slowInc:5},
    // Calves — high rep, slower upper progress
    stand_calf:   {inc:5,  slowInc:5},
    seat_calf:    {inc:5,  slowInc:5},
    // Isolation legs
    leg_ext:      {inc:5,  slowInc:5},
    leg_curl:     {inc:5,  slowInc:5},
    // Core/cardio — reps/time based, no weight increment
    plank_m:      {inc:0},
    dead_bug:     {inc:0},
    bike:         {inc:0},
    hang_knee:    {inc:1, slowInc:1, unit:"rep"},
    ab_wheel:     {inc:1, slowInc:1, unit:"rep"},
    rev_crunch:   {inc:1, slowInc:1, unit:"rep"},
    woodchop:     {inc:2.5, slowInc:2.5},
    side_plank:   {inc:0},
    hip_flex:     {inc:0},
    foam_roll:    {inc:0},
    pushup:       {inc:1, slowInc:1, unit:"rep"},
  };

  var cfg = increments[exId] || {inc:5, slowInc:2.5};
  if(cfg.inc === 0) return {amount:0, unit:"—"};

  // Slow down progression after initial phase
  // Weeks 1-4: full increment, Weeks 5-12: full, Weeks 13+: half increment
  var amount = trainingWeeks >= 13 ? cfg.slowInc : cfg.inc;
  return {amount, unit: cfg.unit || "lbs"};
}

function getSuggestedWeight(last, exId, exName) {
  if(!last || last.maxWeight <= 0) return null;
  var history = getExHistory(exId, exName, 6);
  if(history.length < 2) {
    var trainingWeeks = ST.workoutLogs.length > 0 ? Math.ceil((daysAgo(ST.workoutLogs[ST.workoutLogs.length-1].date)+1)/7) : 1;
    var prog = getProgressionIncrement(exId, trainingWeeks);
    if(prog.unit === "rep" || prog.amount === 0) return last.maxWeight;
    return last.totalSets >= 3 ? last.maxWeight + prog.amount : last.maxWeight;
  }

  // Training age in weeks
  var firstLog = ST.workoutLogs.length > 0 ? ST.workoutLogs[ST.workoutLogs.length-1].date : last.date;
  var trainingWeeks = Math.ceil((daysAgo(firstLog)+1)/7);
  var prog = getProgressionIncrement(exId, trainingWeeks);
  if(prog.amount === 0) return null;

  // Check for stall: same weight for 3+ sessions in a row
  var recentWeights = history.slice(0,3).map(function(h){ return h.maxWeight; });
  var isStalled = recentWeights.length >= 3 && recentWeights.every(function(w){ return w===recentWeights[0]; });

  var daysSinceLast = daysAgo(last.date);
  var longBreak = daysSinceLast > 10;
  var lastIncomplete = last.totalSets < 3;
  var repTrend = history.slice(0,3).map(function(h){ return h.maxReps; });
  var repsDropping = repTrend.length >= 3 && repTrend[0] < repTrend[1] && repTrend[1] < repTrend[2];

  if(isStalled && !longBreak) return Math.round(last.maxWeight * 0.9 / 2.5) * 2.5;
  if(longBreak) return Math.round(last.maxWeight * 0.9 / 2.5) * 2.5;
  if(lastIncomplete) return last.maxWeight;
  if(repsDropping) return last.maxWeight;

  return last.maxWeight + prog.amount;
}

function getProgressionNote(last, exId, exName) {
  if(!last || last.maxWeight <= 0) return null;
  var history = getExHistory(exId, exName, 6);
  if(history.length < 2) return null;

  var firstLog = ST.workoutLogs.length > 0 ? ST.workoutLogs[ST.workoutLogs.length-1].date : last.date;
  var trainingWeeks = Math.ceil((daysAgo(firstLog)+1)/7);
  var prog = getProgressionIncrement(exId, trainingWeeks);

  var recentWeights = history.slice(0,3).map(function(h){ return h.maxWeight; });
  var isStalled = recentWeights.length >= 3 && recentWeights.every(function(w){ return w===recentWeights[0]; });
  var daysSinceLast = daysAgo(last.date);
  var longBreak = daysSinceLast > 10;
  var lastIncomplete = last.totalSets < 3;
  var repTrend = history.slice(0,3).map(function(h){ return h.maxReps; });
  var repsDropping = repTrend.length >= 3 && repTrend[0] < repTrend[1] && repTrend[1] < repTrend[2];

  if(prog.amount === 0) return {text:"Track reps/time — no weight needed", color:"var(--muted)"};
  if(isStalled && !longBreak) return {text:"Stalled 3x — deload 10% and rebuild", color:"var(--orange)"};
  if(longBreak) return {text:`Back after ${daysSinceLast}d — ease in at 90%`, color:"var(--yellow)"};
  if(lastIncomplete) return {text:"Incomplete last session — hold weight", color:"var(--yellow)"};
  if(repsDropping) return {text:"Reps declining — hold weight, focus form", color:"var(--yellow)"};

  var phaseNote = trainingWeeks >= 13 ? " (slower phase)" : trainingWeeks >= 5 ? "" : " (newbie gains!)";
  return {text:`Add ${prog.amount}${prog.unit}${phaseNote}`, color:"var(--green)"};
}

function getExPriority(exId) {
  var mustDo = ["back_squat","bench","ohp","pullup","hip_thrust","bb_row","rdl_mon","rdl_thu","rdl_sat"];
  var optional = ["stand_calf","seat_calf","oh_tri","incline_curl","hammer","lat_fin","cable_super","ez_super","plank_m","dead_bug","foam_roll","hip_flex"];

function getPRs() {

function proteinStreak() {

  return `

function attachSleepSteps() {
  document.querySelectorAll("[data-sleep-set]").forEach(function(el) {
    el.addEventListener("click", function() {
      var dl = getDailyLog(today()) || {id:today(),date:today(),steps:0,sleep_hours:0};
      dl.sleep_hours = Math.round(parseFloat(el.dataset.sleepSet)*4)/4;
      upsertDailyLog(today(), {sleep_hours:dl.sleep_hours, steps:dl.steps||0});
      var card = document.getElementById("sleep-card");
      if(card) { card.innerHTML = buildSleepCardInner(dl.sleep_hours); attachSleepSteps(); }
    });
  });
  document.querySelectorAll("[data-steps]").forEach(function(el) {
    el.addEventListener("click", function() {
      var dl = getDailyLog(today()) || {id:today(),date:today(),steps:0,sleep_hours:0};
      dl.steps = Math.max(0, (dl.steps||0) + parseInt(el.dataset.steps));
      upsertDailyLog(today(), {steps:dl.steps, sleep_hours:dl.sleep_hours||0});
      var card = document.getElementById("steps-card");
      if(card) { card.innerHTML = buildStepsCardInner(dl.steps); attachSleepSteps(); }
    });
  });
}

function renderExBlock(ex, idx) {
  const sets=ST.activeSets[ex.id]||[], open=ST.openEx[ex.id], guideOpen=ST.openGuide[ex.id];
  const doneCount=sets.filter(s=>s.done).length, allDone=doneCount===sets.length&&sets.length>0;
  const planColor=PLAN[ST.activeDay].color;
  const priority=getExPriority(ex.id);
  const last=getLastExSession(ex.id, ex.name);
  const suggested=getSuggestedWeight(last, ex.id, ex.name);
  const progNote=getProgressionNote(last, ex.id, ex.name);
  const priorityStyle={
    must:     {bg:"rgba(239,68,68,.15)",  color:"var(--red)",    label:"🔴 Must Do"},
    important:{bg:"rgba(234,179,8,.15)",  color:"var(--yellow)", label:"🟡 Important"},
    optional: {bg:"rgba(107,107,136,.15)",color:"var(--muted)",  label:"⚪ Optional"},
  }[priority];

  return `
  <div class="exb" style="${allDone?`border-color:${planColor}55`:""}" id="ex-${ex.id}">
    <div class="exh" data-toggle-ex="${ex.id}">
      <div class="exnum${allDone?" done":""}">${allDone?"✓":(idx+1)}</div>
      <div class="exinfo">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <div class="exname">${ex.name}</div>
          <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:${priorityStyle.bg};color:${priorityStyle.color}">${priorityStyle.label}</span>
        </div>
        <div class="exspec">${ex.sets}×${ex.reps} · ${ex.tempo} · Rest ${ex.rest}${doneCount>0?` · <span style="color:var(--green)">${doneCount}/${sets.length} ✓</span>`:""}</div>
        <div style="font-size:11px;font-weight:700;color:var(--muted2);margin-top:3px">🎯 ${ex.muscles}</div>
        ${last?`<div style="font-size:11px;color:var(--muted);margin-top:2px">
          Last: <strong style="color:var(--text)">${last.maxWeight}lbs × ${last.maxReps} reps</strong> (${fmtDate(last.date)})
          ${suggested?` · <strong style="color:${planColor}">Target: ${suggested}lbs</strong>`:""}
        </div>
        ${progNote?`<div style="font-size:11px;font-weight:600;color:${progNote.color};margin-top:2px">→ ${progNote.text}</div>`:""}
        `:`<div style="font-size:11px;color:var(--muted);margin-top:2px">No previous data — establish your baseline today</div>`}
      </div>
      <div class="exarr${open?" open":""}">⌄</div>
    </div>
    ${open?`
    <div style="padding:0 14px 10px">

  const todayE=nutByDate(today()), sum=nutSum(todayE), water=todayWater(), filled=Math.round((water/TARGETS.water)*8);
  return `
  <div class="ph" style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px">
    <div><div class="pt">NUTRITION</div><div class="ps">Target: ${TARGETS.p}g protein · ${TARGETS.cal} kcal</div></div>
    <button data-action="open-cheat" style="background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);color:var(--accent);border-radius:var(--rs);padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-b);white-space:nowrap;margin-bottom:14px">📋 Foods</button>
  </div>
  <div class="tab-pills">${["today","week"].map(t=>`<div class="tab-pill${ST.nutTab===t?" active":""}" data-nut-tab="${t}">${t==="today"?"Today":"This Week"}</div>`).join("")}</div>

function renderNutToday(sum, entries, water, filled) {
  // Macro bars — each bar represents the daily goal, filled portion = consumed
  const bars = [
    {label:"Protein", val:ri(sum.p),  target:TARGETS.p,  color:"#22c55e", unit:"g"},
    {label:"Carbs",   val:ri(sum.c),  target:TARGETS.c,  color:"#4f8ef7", unit:"g"},
    {label:"Fat",     val:ri(sum.f),  target:TARGETS.f,  color:"#eab308", unit:"g"},
  ];
  return `
  <div style="padding:0 16px 12px">
    <button class="btn bp bfull" data-action="open-food">+ Log Food</button>
  </div>
  <div class="card"><div class="ct">Today's Macros</div>${macroRows(sum)}</div>
  <div class="card">
    <div class="ct">Calorie Budget</div>
    ${(()=>{
      const remaining  = TARGETS.cal - sum.cal;
      const pLeft      = Math.max(0, Math.round(TARGETS.p - ri(sum.p)));
      const isCalOver  = remaining < 0;
      const isProtDone = pLeft === 0;
      const calColor   = isCalOver ? "var(--red)" : remaining < 200 ? "var(--yellow)" : "var(--green)";
      const protColor  = isProtDone ? "var(--green)" : pLeft > 50 ? "var(--red)" : "var(--orange)";

      // Protein sources — grams needed to hit pLeft, and whether they fit in remaining calories
      const protSources = [
        {name:"Whey shake",      pPer100:80,  calPer100:400, unit:"g",    emoji:"🥤", note:"~1 scoop = 30g"},
        {name:"Chicken breast",  pPer100:31,  calPer100:165, unit:"g",    emoji:"🍗", note:"cooked"},
        {name:"Greek yogurt",    pPer100:10,  calPer100:73,  unit:"g",    emoji:"🫙", note:"2% fat"},
        {name:"Cottage cheese",  pPer100:11,  calPer100:90,  unit:"g",    emoji:"🧀", note:"2% fat"},
        {name:"Egg whites",      pPer100:11,  calPer100:52,  unit:"g",    emoji:"🥚", note:"~3 whites = 100g"},
        {name:"Tuna (canned)",   pPer100:26,  calPer100:116, unit:"g",    emoji:"🐟", note:"drained"},
      ];

      const suggestions = protSources.map(s => {
        const gramsNeeded = pLeft > 0 ? Math.round(pLeft / (s.pPer100/100)) : 0;
        const calCost = Math.round(gramsNeeded * s.calPer100 / 100);
        const fits = calCost <= remaining + 100; // 100 kcal wiggle room
        return {...s, gramsNeeded, calCost, fits};
      }).filter(s => s.gramsNeeded > 0 && s.gramsNeeded < 800);

      return `
        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px">
          <div>
            <div style="font-family:var(--font-d);font-size:40px;letter-spacing:1px;line-height:1;color:${calColor}">${Math.abs(remaining)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px">${isCalOver?"kcal over budget":"kcal remaining"}</div>
          </div>
          <div style="text-align:right">
            <div style="font-family:var(--font-d);font-size:28px;letter-spacing:.5px;color:${protColor}">${pLeft}g</div>
            <div style="font-size:12px;color:var(--muted);margin-top:1px">${isProtDone?"protein goal hit! 💪":"protein still needed"}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${ri(sum.p)} / ${TARGETS.p}g logged</div>
          </div>
        </div>

        ${isCalOver && isProtDone ? `
          <div style="background:rgba(34,197,94,.08);border-left:3px solid var(--green);border-radius:0 var(--rs) var(--rs) 0;padding:10px 12px;font-size:12px;color:var(--muted2)">
            Protein goal hit ✅ — slightly over on calories but macros are solid. One day won't derail progress.
          </div>

        ` : isCalOver && !isProtDone ? `
          <div style="background:rgba(239,68,68,.08);border-left:3px solid var(--red);border-radius:0 var(--rs) var(--rs) 0;padding:10px 12px;font-size:12px;color:var(--muted2);margin-bottom:12px">
            Over on calories but still <strong style="color:var(--red)">${pLeft}g short on protein</strong>. Prioritize low-cal, high-protein options below.
          </div>
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">High-protein options to close the gap</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${suggestions.slice(0,4).map(s=>`
            <div style="display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:var(--rs);padding:10px 12px;border:1px solid ${s.fits?"rgba(34,197,94,.2)":"var(--border)"}">
              <div style="font-size:20px">${s.emoji}</div>
              <div style="flex:1">
                <div style="font-weight:700;font-size:13px">${s.name} <span style="font-size:11px;color:var(--muted);font-weight:400">${s.note}</span></div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">${s.calCost} kcal · +${pLeft}g protein</div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-family:var(--font-d);font-size:22px;color:${s.fits?"var(--green)":"var(--orange)"}">${s.gramsNeeded}g</div>
              </div>
            </div>`).join("")}
          </div>

        ` : !isProtDone && remaining > 50 ? `
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Hit your protein with these options</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${suggestions.slice(0,4).map(s=>`
            <div style="display:flex;align-items:center;gap:10px;background:var(--bg3);border-radius:var(--rs);padding:10px 12px;border:1px solid ${s.fits?"rgba(34,197,94,.2)":"rgba(249,115,22,.2)"}">
              <div style="font-size:20px">${s.emoji}</div>
              <div style="flex:1">
                <div style="font-weight:700;font-size:13px">${s.name} <span style="font-size:11px;color:var(--muted);font-weight:400">${s.note}</span></div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">${s.calCost} kcal · closes ${pLeft}g gap · ${s.fits?`<span style="color:var(--green)">fits budget ✓</span>`:`<span style="color:var(--orange)">${s.calCost-remaining} kcal over</span>`}</div>
              </div>
              <div style="text-align:right;flex-shrink:0">
                <div style="font-family:var(--font-d);font-size:22px;color:${s.fits?"var(--green)":"var(--orange)"}">${s.gramsNeeded}g</div>
              </div>
            </div>`).join("")}
          </div>

        ` : isProtDone && !isCalOver ? `
          <div style="background:rgba(34,197,94,.08);border-left:3px solid var(--green);border-radius:0 var(--rs) var(--rs) 0;padding:10px 12px;font-size:12px;color:var(--muted2)">
            Protein goal hit and ${remaining} kcal still available. Fill with carbs around your workout or fats if it's late. 🎯
          </div>
        ` : `
          <div style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0">Almost there — on track! 🎯</div>
        `}
      `;
    })()}
  </div>
  <div class="card" id="water-card">
    <div class="ct">Water — ${water.toFixed(1)}L / ${TARGETS.water}L</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="btn bg" style="padding:8px 12px;font-size:13px" data-water="-0.25">-¼L</button>
      <button class="btn bp" style="flex:1;padding:8px;font-size:13px" data-water="0.25">+¼L</button>
      <button class="btn bp" style="flex:1;padding:8px;font-size:13px" data-water="0.5">+½L</button>
    </div>
    <div class="pb-wrap" style="margin-bottom:10px"><div class="pb-fill" style="width:${Math.min(100,(water/TARGETS.water)*100).toFixed(1)}%;background:#06b6d4"></div></div>
    <div class="water-track">${Array.from({length:8},(_,i)=>`<div class="water-drop${i<filled?" filled":""}">💧</div>`).join("")}</div>
  </div>
  <div class="card"><div class="ct">Food Log — ${entries.length} items</div>
    ${entries.length===0?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">No food logged yet today.</div>`:entries.map(e=>`<div class="food-item"><div class="food-dot" style="background:${e.p>30?"#22c55e":e.cal>400?"#f97316":"#4f8ef7"}"></div><div class="food-info"><div class="food-name">${e.name}</div><div class="food-macros">${e.grams}g · ${e.cal} kcal · P:${ri(e.p)}g C:${ri(e.c)}g F:${ri(e.f)}g</div></div><button style="background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;font-family:var(--font-b)" data-edit-food="${e.id}">Edit</button><button class="food-del" data-del-food="${e.id}">×</button></div>`).join("")}
  </div>`;
}
function renderNutWeek() {
  // Build 7 days data
  const days7 = [];
  for(let i=6;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().split("T")[0];
    const s=nutSum(nutByDate(ds));
    const entries=nutByDate(ds);
    days7.push({
      date:ds,
      label:new Date(ds+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"}),
      dayNum:new Date(ds+"T12:00:00").getDate(),
      cal:s.cal||0, p:ri(s.p)||0, c:ri(s.c)||0, f:ri(s.f)||0,
      logged:entries.length>0,
      entries
    });
  }

  const selectedDay = ST.weekDay || today();
  const selData = days7.find(d=>d.date===selectedDay) || days7[days7.length-1];
  const selEntries = nutByDate(selectedDay);
  const selSum = nutSum(selEntries);
  const selWater = ST.nutritionLogs.find(l=>l.date===selectedDay&&l.type==="water");

  // 7-day totals vs goals
  const loggedDays = days7.filter(d=>d.logged);
  const totals = days7.reduce((a,d)=>({cal:a.cal+d.cal, p:a.p+d.p, c:a.c+d.c, f:a.f+d.f}),{cal:0,p:0,c:0,f:0});
  const weekGoal = {cal:TARGETS.cal*7, p:TARGETS.p*7, c:TARGETS.c*7, f:TARGETS.f*7};

  return `
  <!-- 7-day summary bars -->
  <div class="card" style="margin-top:4px">
    <div class="ct">7-Day Progress vs Goal</div>
    ${[
      {label:"Calories", val:totals.cal, goal:weekGoal.cal, color:"#f97316", unit:"kcal"},
      {label:"Protein",  val:totals.p,   goal:weekGoal.p,   color:"#22c55e", unit:"g"},
      {label:"Carbs",    val:totals.c,   goal:weekGoal.c,   color:"#4f8ef7", unit:"g"},
      {label:"Fat",      val:totals.f,   goal:weekGoal.f,   color:"#eab308", unit:"g"},
    ].map(m=>{
      const pct=Math.min(100,(m.val/m.goal)*100).toFixed(1);
      const over=m.val>m.goal;
      return `<div class="pb-row">
        <div class="pb-label">
          <span class="pb-name">${m.label}</span>
          <span class="pb-val" style="color:${over?"var(--red)":"var(--muted)"}">${m.val}${m.unit} / ${m.goal}${m.unit}</span>
        </div>
        <div class="pb-wrap"><div class="pb-fill" style="width:${pct}%;background:${over?"var(--red)":m.color}"></div></div>
      </div>`;
    }).join("")}
    <div style="font-size:11px;color:var(--muted);margin-top:6px">${loggedDays.length}/7 days logged · ${7-loggedDays.length} days missing</div>
  </div>

  <!-- Day picker -->
  <div style="display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none">
    ${days7.map(d=>{
      const isSel=d.date===selectedDay;
      const isToday=d.date===today();
      return `<div data-week-day="${d.date}" style="flex-shrink:0;width:44px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:var(--r);background:${isSel?"var(--accent)":"var(--bg2)"};border:1px solid ${isSel?"var(--accent)":d.logged?"var(--border)":"var(--border)"};transition:all .15s">
        <div style="font-size:10px;font-weight:700;color:${isSel?"white":isToday?"var(--accent)":"var(--muted)"}">${d.label}</div>
        <div style="font-family:var(--font-d);font-size:18px;color:${isSel?"white":"var(--text)"};margin:2px 0">${d.dayNum}</div>
        <div style="width:6px;height:6px;border-radius:50%;background:${d.logged?(isSel?"white":"var(--green)"):"transparent"};margin:0 auto"></div>
      </div>`;
    }).join("")}
  </div>

  <!-- Selected day food log -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div class="ct" style="margin-bottom:0">${new Date(selectedDay+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">${selSum.cal} kcal · P:${ri(selSum.p)}g · C:${ri(selSum.c)}g · F:${ri(selSum.f)}g${selWater?` · 💧${selWater.liters}L`:""}</div>
      </div>
      <button class="btn bp" style="font-size:12px;padding:8px 14px" data-action="open-food-for-day" data-date="${selectedDay}">+ Add</button>
    </div>
    <!-- Macro bars for selected day -->
    ${[
      {label:"Calories",val:selSum.cal,target:TARGETS.cal,color:"#f97316",unit:"kcal"},
      {label:"Protein", val:ri(selSum.p),target:TARGETS.p, color:"#22c55e",unit:"g"},
      {label:"Carbs",   val:ri(selSum.c),target:TARGETS.c, color:"#4f8ef7",unit:"g"},
      {label:"Fat",     val:ri(selSum.f),target:TARGETS.f, color:"#eab308",unit:"g"},
    ].map(m=>{
      const pct=Math.min(100,(m.val/m.target)*100).toFixed(1);
      const over=m.val>m.target;
      return `<div class="pb-row"><div class="pb-label"><span class="pb-name" style="font-size:11px">${m.label}</span><span class="pb-val">${m.val}${m.unit} / ${m.target}${m.unit}</span></div><div class="pb-wrap"><div class="pb-fill" style="width:${pct}%;background:${over?"var(--red)":m.color}"></div></div></div>`;
    }).join("")}
    ${selEntries.length===0?
      `<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">No food logged for this day</div>`:
      selEntries.map(e=>`<div class="food-item">
        <div class="food-dot" style="background:${e.p>30?"#22c55e":e.cal>400?"#f97316":"#4f8ef7"}"></div>
        <div class="food-info"><div class="food-name">${e.name}</div><div class="food-macros">${e.grams}g · ${e.cal} kcal · P:${ri(e.p)}g C:${ri(e.c)}g F:${ri(e.f)}g</div></div>
        <button style="background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;padding:4px 6px;font-family:var(--font-b)" data-edit-food="${e.id}">Edit</button>
        <button class="food-del" data-del-food="${e.id}">×</button>
      </div>`).join("")}
  </div>

  <!-- Protein streak -->
  <div class="card"><div class="ct">Protein Streak — hit ${TARGETS.p}g (14 days)</div>
    <div class="streak-row">${proteinStreak().map(d=>`<div class="streak-day${d.hit?" hit":d.logged?" miss":""}">${d.label}</div>`).join("")}</div>
  </div>`;
}

        ${f.cat==="Photo Lookup"?`<span style="font-size:10px;background:rgba(79,142,247,.15);color:var(--accent);padding:2px 6px;border-radius:99px;font-weight:700">📷 Photo</span>`:""}
      </div>

function buildCSTableHTML() {
  const q = (ST.csSearch||"").toLowerCase();
  const filtered = FOODS.filter(f => {
    const catOk = ST.csFilter==="All" || f.cat===ST.csFilter || (f.cuisine||[]).includes(ST.csFilter);
    return catOk && (!q || f.n.toLowerCase().includes(q));
  });
  if(!filtered.length) return `<div class="cs-thead"><div>Food</div><div style="text-align:right">Cal</div><div style="text-align:right">P</div><div style="text-align:right">C</div><div style="text-align:right">F</div></div><div style="padding:20px;text-align:center;color:var(--muted)">No foods found</div>`;
  return `<div class="cs-thead"><div>Food</div><div style="text-align:right">Cal</div><div style="text-align:right">P</div><div style="text-align:right">C</div><div style="text-align:right">F</div></div>` +
    filtered.map(f => {
      const exp = ST.csExpanded === f.n;
      const s50=calcMacros(f,50), s100=calcMacros(f,100), s150=calcMacros(f,150), s200=calcMacros(f,200);
      return `<div class="cs-row${exp?" expanded":""}" data-cs-exp="${f.n}">
        <div><div class="cs-fname">${f.n}</div><div class="cs-cat">${f.cat}</div></div>
        <div class="cs-num" style="color:#f97316">${f.cal}</div>
        <div class="cs-num" style="color:#22c55e">${ri(f.p)}g</div>
        <div class="cs-num" style="color:#4f8ef7">${ri(f.c)}g</div>
        <div class="cs-num" style="color:#eab308">${ri(f.f)}g</div>
      </div>
      ${exp?`<div class="cs-detail">
        <div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Serving Sizes</div>
        <div class="cs-serving">
          <div class="cs-sv-item"><div class="cs-sv-label">50g</div><div class="cs-sv-macros">${s50.cal} kcal · P:${ri(s50.p)}g C:${ri(s50.c)}g F:${ri(s50.f)}g</div></div>
          <div class="cs-sv-item"><div class="cs-sv-label">100g</div><div class="cs-sv-macros">${s100.cal} kcal · P:${ri(s100.p)}g C:${ri(s100.c)}g F:${ri(s100.f)}g</div></div>
          <div class="cs-sv-item"><div class="cs-sv-label">150g</div><div class="cs-sv-macros">${s150.cal} kcal · P:${ri(s150.p)}g C:${ri(s150.c)}g F:${ri(s150.f)}g</div></div>
          <div class="cs-sv-item"><div class="cs-sv-label">200g</div><div class="cs-sv-macros">${s200.cal} kcal · P:${ri(s200.p)}g C:${ri(s200.c)}g F:${ri(s200.f)}g</div></div>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--muted)">Cuisines: ${(f.cuisine||["All"]).join(", ")}</div>
        <button class="btn bp" style="margin-top:10px;font-size:12px;padding:8px 16px" data-prefill='${JSON.stringify({n:f.n,cal:f.cal,p:f.p,c:f.c,f:f.f,cat:f.cat}).replace(/'/g,"&#39;")}'>+ Log This Food →</button>
      </div>`:""}`;
    }).join("");
}

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">
        ${[["Weight",s.weight,"lbs"],["Body Fat",s.bf,"%"],["Lean Mass",s.weight&&s.bf?getLean(s.weight,s.bf):null,"lbs"],["Waist",s.waist,'"'],["Hips",s.hips,'"'],["Chest",s.chest,'"'],["R Arm",s.r_arm,'"'],["L Arm",s.l_arm,'"'],["R Thigh",s.r_thigh,'"'],["L Thigh",s.l_thigh,'"']].filter(([,v])=>v).map(([label,val,unit])=>`

function attachStatEntryListeners(container, id) {
  // Expand/collapse toggle — surgical, no render()
  var expEl = container.querySelector("[data-exp-stat]");
  if(expEl) expEl.addEventListener("click", function(e){
    // Ignore clicks on action buttons inside the expanded panel
    if(e.target.closest("[data-edit-stat],[data-del-stat],[data-del-photo-idx],[data-view-photo],[data-photo-stat],label,button")) return;
    e.stopPropagation();
    ST.expandedStat = (ST.expandedStat===id) ? null : id;
    var s = ST.bodyStats.find(function(x){return x.id===id;});
    if(!s) return;
    var isExp = ST.expandedStat===id;
    container.innerHTML = buildStatEntryHTML(s, isExp, !!s.photo_path, ST.photoUploading===id);
    attachStatEntryListeners(container, id);
  });
  // View photo
  var vpEl = container.querySelector("[data-view-photo]");
  if(vpEl) vpEl.addEventListener("click", function(e){
    e.stopPropagation();
    ST.viewingPhoto = vpEl.dataset.viewPhoto;
    render();
  });
  // Photo upload — appends to photos array
  container.querySelectorAll("[data-photo-stat]").forEach(function(el){
    el.addEventListener("change", function(){
      var file = el.files[0]; if(!file) return;
      var statId = el.dataset.photoStat;
      ST.photoUploading = statId;
      var stat0 = ST.bodyStats.find(function(x){return x.id===statId;});
      container.innerHTML = buildStatEntryHTML(stat0||{id:statId}, true, false, true);
      attachStatEntryListeners(container, statId);
      sbUploadPhoto(statId, file).then(function(path){
        if(path){
          var stat = ST.bodyStats.find(function(x){return x.id===statId;});
          if(stat){
            var photos = getPhotos(stat);
            photos.push(path);
            setPhotos(stat, photos);
            saveBodyStat(stat);
          }
        }
        ST.photoUploading = null;
        var s2 = ST.bodyStats.find(function(x){return x.id===statId;});
        if(s2){ container.innerHTML=buildStatEntryHTML(s2,true,getPhotos(s2).length>0,false); attachStatEntryListeners(container,statId); }
      });
    });
  });

  // Delete individual photo by index
  container.querySelectorAll("[data-del-photo-idx]").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var idx = parseInt(btn.dataset.delPhotoIdx);
      var statId = btn.dataset.delPhotoStat;
      var stat = ST.bodyStats.find(function(x){return x.id===statId;});
      if(!stat) return;
      var photos = getPhotos(stat);
      var removed = photos.splice(idx, 1);
      if(removed[0]) sbDeletePhoto(removed[0]);
      setPhotos(stat, photos);
      saveBodyStat(stat);
      container.innerHTML = buildStatEntryHTML(stat, true, photos.length>0, false);
      attachStatEntryListeners(container, statId);
    });
  });
  // Edit stat
  var editEl = container.querySelector("[data-edit-stat]");
  if(editEl) editEl.addEventListener("click", function(e){
    e.stopPropagation();
    var stat = ST.bodyStats.find(function(x){return x.id===editEl.dataset.editStat;});
    if(stat){ ST.editingStat=stat; ST.showBodyModal=true; render(); }
  });
  // Delete stat
  var delEl = container.querySelector("[data-del-stat]");
  if(delEl) delEl.addEventListener("click", function(e){
    e.stopPropagation();
    if(!confirm("Delete this entry?")) return;
    var statId=delEl.dataset.delStat;

function getFilteredStats(rangeDays) {
  const cutoff = rangeDays===0 ? new Date(0) : new Date();
  if(rangeDays>0) cutoff.setDate(cutoff.getDate()-rangeDays);
  return [...ST.bodyStats]
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .filter(s=>new Date(s.date+"T12:00:00")>=cutoff);
}

// REST TIMER
// ══════════════════════════════════════════════════
let timerInt = null;
let timerEndTime = null; // absolute end time so background doesn't drift

// When app comes back into focus (unlock, tab switch back), check timer immediately
// WakeLock blocked by GitHub Pages permissions policy — users should set
// Settings → Display & Brightness → Auto-Lock → Never while working out
// Re-acquire lock when app comes back to foreground (iOS releases it when backgrounded)
document.addEventListener("visibilitychange", function() {
  if(document.visibilityState === "visible" && timerEndTime && ST.restTimer) {
    var remaining = Math.round((timerEndTime - Date.now()) / 1000);
    if(remaining <= 0) {
      // Timer expired while phone was locked — just cancel silently, don't fire alert
      stopTimer();
    }
  }

function requestNotificationPermission() {
  if("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

// Audio — use embedded WAV element for iOS reliability
// iOS allows audio.play() from a timer callback as long as the element
// was "unlocked" by a previous user tap
var _beepEl = null;
var _beepUnlocked = false;

function getBeepEl() {
  if(!_beepEl) {
    _beepEl = document.getElementById("beep-sound");
    if(_beepEl) {
      // When beep finishes, nudge iOS to resume background audio
      _beepEl.addEventListener("ended", function() {
        // Brief silence then resume — iOS sometimes needs this nudge
        if(_beepEl.audioSession) {
          try { _beepEl.audioSession.type = "ambient"; } catch(e) {}
        }
      });
    }
  }
  return _beepEl;
}

// Unlock audio on every user tap
function unlockAudio() {
  if(_beepUnlocked) return;
  // Use a silent AudioContext buffer to unlock — this does NOT interrupt background music
  // unlike playing an <audio> element even at volume 0
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var buf = ctx.createBuffer(1, 1, 22050);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    src.stop(0.001);
    _beepUnlocked = true;
    ctx.close();
  } catch(e) {}
}

document.addEventListener("touchstart", unlockAudio, {passive: true});
document.addEventListener("touchend",   unlockAudio, {passive: true});
document.addEventListener("click",      unlockAudio, {passive: true});

function playBeeps() {
  var el = getBeepEl();
  if(!el) return;
  el.currentTime = 0;
  el.volume = 1;
  // Tell iOS to mix with background audio (music) rather than interrupting it
  if(el.audioSession) {
    try { el.audioSession.type = "transient"; } catch(e) {}
  }
  el.play().catch(function(e){ console.log("Audio play failed:", e); });
}

function sendRestDoneNotification(restLabel) {
  // 1. Vibrate
  if(navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);

  // 2. Play beep
  playBeeps();

  // 3. Speech
  try {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance("Next set!");
    msg.volume = 1; msg.rate = 0.9; msg.pitch = 1.1;
    window.speechSynthesis.speak(msg);
  } catch(e) {}

  // 4. Push notification
  if("Notification" in window && Notification.permission === "granted") {
    try { new Notification("Rest done! 💪", {body:"Time to hit your next set", tag:"rest-timer"}); } catch(e) {}
  }
}

function startTimer(rest) {
  stopTimer();
  requestNotificationPermission();
  const map = {"3 min":180,"2 min":120,"90 sec":90,"60 sec":60,"45 sec":45};
  const secs = Object.entries(map).reduce((a,[k,v])=>rest&&rest.includes(k.split(" ")[0])?v:a, 90);
  timerEndTime = Date.now() + secs * 1000;
  ST.restTimer = {secs, total:secs};

  // Render timer UI
  const existing = document.querySelector(".rtimer");
  if(!existing) {
    const div = document.createElement("div");
    document.getElementById("app")?.appendChild(div);
    div.outerHTML = renderTimer();
  }

  timerInt = setInterval(()=>{
    if(!ST.restTimer || !timerEndTime) { clearInterval(timerInt); return; }
    // Use absolute time so background doesn't cause drift
    const remaining = Math.round((timerEndTime - Date.now()) / 1000);
    if(remaining <= 0) {
      stopTimer();
      sendRestDoneNotification(rest);
      return;
    }
    ST.restTimer.secs = remaining;
    const tc=document.getElementById("rtc"), tb=document.getElementById("rtb");
    const m=Math.floor(remaining/60), s=remaining%60;
    if(tc) tc.textContent=`${m}:${s.toString().padStart(2,"0")}`;
    if(tb) tb.style.width=`${(remaining/ST.restTimer.total)*100}%`;
  }, 500); // check every 500ms for accuracy
}

function stopTimer() {
  clearInterval(timerInt);
  timerInt = null;
  timerEndTime = null;
  ST.restTimer = null;
  const el = document.querySelector(".rtimer");
  if(el) el.remove();
}

function addWater(amt) {
  const t=today(); let log=ST.nutritionLogs.find(l=>l.date===t&&l.type==="water");
  if(log) {
    log.liters=Math.max(0,Math.round((log.liters+amt)*100)/100);
    saveWaterLog(log);
  } else if(amt>0) {
    log={id:Date.now().toString(),date:t,type:"water",liters:amt};
    ST.nutritionLogs.unshift(log);
    saveWaterLog(log);
  } else { save(); return; }

  // Update only the water card — no full render, no scroll reset
  const water=log.liters, filled=Math.round((water/TARGETS.water)*8);
  const card=document.getElementById("water-card");
  if(card) {
    card.innerHTML=`
      <div class="ct">Water — ${water.toFixed(1)}L / ${TARGETS.water}L</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <button class="btn bg" style="padding:8px 12px;font-size:13px" data-water="-0.25">-¼L</button>
        <button class="btn bp" style="flex:1;padding:8px;font-size:13px" data-water="0.25">+¼L</button>
        <button class="btn bp" style="flex:1;padding:8px;font-size:13px" data-water="0.5">+½L</button>
      </div>
      <div class="pb-wrap" style="margin-bottom:10px"><div class="pb-fill" style="width:${Math.min(100,(water/TARGETS.water)*100).toFixed(1)}%;background:#06b6d4"></div></div>
      <div class="water-track">${Array.from({length:8},(_,i)=>`<div class="water-drop${i<filled?" filled":""}">💧</div>`).join("")}</div>`;
    card.querySelectorAll("[data-water]").forEach(el=>el.addEventListener("click",()=>addWater(parseFloat(el.dataset.water))));
  } else {
    render();
  }
}

    }
    // Edit
    const editBtn = e.target.closest("[data-edit-food]");
    if(editBtn) {
      var fid = editBtn.dataset.editFood;
      var entry = ST.nutritionLogs.find(function(l){return l.id===fid;});
      if(!entry) return;
      ST.editingFood = entry;
      ST.foodEntry = {
        food: {n:entry.name, cal:Math.round(entry.cal/(entry.grams/100)), p:Math.round(entry.p/(entry.grams/100)*10)/10, c:Math.round(entry.c/(entry.grams/100)*10)/10, f:Math.round(entry.f/(entry.grams/100)*10)/10, cat:""},
        grams: String(entry.grams)
      };
      ST.foodSearch = entry.name;
      ST.foodResults = [];
      ST.showFoodModal = true;
      render();
      return;
    }
    // Edit body stat
    const editStatBtn = e.target.closest("[data-edit-stat]");
    if(editStatBtn) {
      var sid = editStatBtn.dataset.editStat;
      ST.editingStat = ST.bodyStats.find(function(s){return s.id===sid;}) || null;
      ST.showBodyModal = true;
      render();
    }
  });

  // CHEAT SHEET PANEL
  $("[data-action='open-cheat']")?.addEventListener("click",()=>{ST.showCheatPanel=true;render();});
  $("[data-action='close-cheat']")?.addEventListener("click",()=>{ST.showCheatPanel=false;render();});
  document.getElementById("close-cheat-btn")?.addEventListener("click",function(e){
    e.stopPropagation(); ST.showCheatPanel=false; render();
  });
  // Delete custom food
  // EDIT CUSTOM FOOD
  $$("[data-edit-custom]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    try { ST.editingCustomFood=JSON.parse(el.dataset.editCustom.replace(/&#39;/g,"'")); } catch{}
    render();
  }));
  $("[data-action='close-edit-custom']")?.addEventListener("click",()=>{ST.editingCustomFood=null;render();});
  $("[data-action='save-edit-custom']")?.addEventListener("click",()=>{
    var f=ST.editingCustomFood; if(!f) return;
    var oldName=f.n;
    var updated={
      id:   f.id||oldName.replace(/\s+/g,"_").toLowerCase(),
      n:    document.getElementById("ecf-name")?.value.trim()||f.n,
      cal:  parseFloat(document.getElementById("ecf-cal")?.value)||f.cal,
      p:    parseFloat(document.getElementById("ecf-p")?.value)||f.p,
      c:    parseFloat(document.getElementById("ecf-c")?.value)||f.c,
      f:    parseFloat(document.getElementById("ecf-f")?.value)||f.f,
      cat:  f.cat||"Custom",
      serving_label: document.getElementById("ecf-label")?.value||f.serving_label,
      serving_grams: parseFloat(document.getElementById("ecf-grams")?.value)||f.serving_grams||100,
      food_type: f.food_type||"A",
      source: f.source||"manual"
    };
    var idx=ST.customFoods.findIndex(function(x){return x.n===oldName||x.id===f.id;});
    if(idx>=0) ST.customFoods[idx]=updated;
    else ST.customFoods.unshift(updated);
    save(); saveCustomFoodToCloud(updated);
    ST.editingCustomFood=null; render();
  });

  $$("[data-del-custom]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    var name = el.dataset.delCustom;
    var food = ST.customFoods.find(function(f){return f.n===name;});
    ST.customFoods = ST.customFoods.filter(function(f){return f.n!==name;});
    save();
    if(food && food.id) deleteFromCloud("custom_foods", food.id);
    // Remove just the food row from the DOM — no full render
    var row = el.closest("[data-custom-food-row]");
    if(row) {
      row.remove();
      // Update the count in the header
      var header = document.querySelector("[data-custom-foods-count]");
      if(header) header.textContent = "🤖 My Saved Foods (" + ST.customFoods.length + ")";
      // If no more custom foods, remove the whole section
      if(ST.customFoods.length === 0) {
        var section = document.querySelector("[data-custom-foods-section]");
        if(section) section.remove();
      }
    } else {
      render();
    }
  }));

  // HISTORY TAB TOGGLE (Log / PRs)
  $$("[data-htab]").forEach(el=>el.addEventListener("click",()=>{ST.historyTab=el.dataset.htab;render();}));

  // EXPORT / IMPORT
  $("[data-action='export']")?.addEventListener("click",exportData);
  document.getElementById("import-file")?.addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);});

  // Attach sleep/steps surgical listeners
  attachSleepSteps();
}

// Attach listeners inside the food modal .modal div
function attachFoodModalInner() {
  var $ = function(sel){return document.querySelector(sel);};
  var $$ = function(sel){return document.querySelectorAll(sel);};

  // PHOTO INPUTS — camera and library
  var camEl = document.getElementById("food-photo-camera");
  var libEl = document.getElementById("food-photo-library");
  [camEl, libEl].forEach(function(el){
    if(!el) return;
    el.addEventListener("change", function(){
      var file = el.files[0];
      if(!file) return;
      lookupFoodFromPhoto(file);
    });
  });
  document.querySelectorAll(".quick-serving-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      ST.foodEntry.grams = btn.dataset.qg;
      // Rebuild modal to show active state + update preview
      var modalEl = document.querySelector(".modal");
      if(modalEl){ modalEl.innerHTML = buildFoodModalInner(); attachFoodModalInner(); }
    });
  });

  // Search input — must be re-attached every time modal inner rebuilds
  var fsEl = document.getElementById("food-search-input");
  if(fsEl) {
    fsEl.addEventListener("input", function() {
      ST.foodSearch = fsEl.value;
      ST.foodResults = searchFoods(fsEl.value);
      var modalEl = document.querySelector(".modal");
      if(modalEl) {
        modalEl.innerHTML = buildFoodModalInner();
        attachFoodModalInner();
        var newInput = document.getElementById("food-search-input");
        if(newInput) { newInput.focus(); newInput.setSelectionRange(newInput.value.length, newInput.value.length); }
      }
    });
  }

  // Ask Claude button
  var askBtn = document.getElementById("ask-claude-btn");
  if(askBtn) {
    askBtn.addEventListener("click", function() {
      lookupFoodWithClaude(ST.foodSearch);
    });
  }

  // Select food from search results
  $$("[data-sel-food]").forEach(function(el){
    el.addEventListener("click",function(){
      try { ST.foodEntry.food=JSON.parse(el.dataset.selFood.replace(/&#39;/g,"'")); } catch {}
      ST.foodResults=[]; ST.foodSearch=ST.foodEntry.food.n;
      // Pre-fill grams with natural serving size for Claude lookups
      if(ST.foodEntry.food.cat==="Claude Lookup" && ST.foodEntry.food.serving_grams && ST.foodEntry.food.food_type !== "A") {
        ST.foodEntry.grams = String(ST.foodEntry.food.serving_grams);
      } else if(!ST.editingFood) {
        ST.foodEntry.grams="";
      }
      var modalEl=document.querySelector(".modal");
      if(modalEl){ modalEl.innerHTML=buildFoodModalInner(); attachFoodModalInner(); }
      // Focus grams input if already pre-filled, otherwise search
      setTimeout(function(){
        var gi = document.getElementById("food-grams-input");
        if(gi) gi.focus();
      },100);
    });
  });

  // Grams input — only update preview, never re-render
  var gramsEl=document.getElementById("food-grams-input");
  if(gramsEl) {
    gramsEl.addEventListener("input",function(){
      ST.foodEntry.grams=gramsEl.value;
      updateMacroPreview();
    });
  }

  // Save / Update button
  var saveBtn=document.getElementById("save-food-btn");
  if(saveBtn) {
    saveBtn.addEventListener("click",function(){
      var g=document.getElementById("food-grams-input")?.value;
      if(g) ST.foodEntry.grams=g;
      if(!ST.foodEntry.food||!ST.foodEntry.grams) return;
      var m=calcMacros(ST.foodEntry.food,ST.foodEntry.grams);
      if(ST.editingFood) {
        var updated={id:ST.editingFood.id,date:ST.editingFood.date,type:"food",name:ST.foodEntry.food.n,grams:parseFloat(ST.foodEntry.grams),cal:m.cal,p:m.p,c:m.c,f:m.f};
        var idx=ST.nutritionLogs.findIndex(function(l){return l.id===ST.editingFood.id;});
        if(idx>=0) ST.nutritionLogs[idx]=updated;
        saveNutritionLog(updated);
        ST.editingFood=null;
      } else {
        var logDate = (ST.nutTab==="week" && ST.weekDay) ? ST.weekDay : today();
        var entry={id:Date.now().toString(),date:logDate,type:"food",name:ST.foodEntry.food.n,grams:parseFloat(ST.foodEntry.grams),cal:m.cal,p:m.p,c:m.c,f:m.f};
        ST.nutritionLogs.unshift(entry);
        saveNutritionLog(entry);
      }
      ST.showFoodModal=false; render();
    });
  }
}

// ══════════════════════════════════════════════════
// BOOT — load from Supabase, fall back to localStorage
// ══════════════════════════════════════════════════
function showLoader() {
  var appEl = document.getElementById("app");
  if(!appEl) return;
  appEl.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:16px;background:#0a0a0f"><div style="font-family:Arial Black,Arial,sans-serif;font-size:42px;letter-spacing:2px;color:#4f8ef7">DIEGO\'S</div><div style="font-family:Arial Black,Arial,sans-serif;font-size:22px;letter-spacing:1px;color:#6b6b88">FITNESS TRACKER</div><div style="width:40px;height:40px;border:3px solid #2a2a3a;border-top-color:#4f8ef7;border-radius:50%;animation:spin 1s linear infinite;margin-top:20px"></div><div style="font-size:13px;color:#6b6b88;margin-top:4px">Loading your data\u2026</div></div>';
}

function loadFromCache() {
  ST.workoutLogs   = S.get("wl", []);
  ST.bodyStats     = S.get("bs", [{id:"init", date:new Date().toISOString().split("T")[0], weight:173, bf:19, waist:null, notes:"Starting point"}]);
  ST.nutritionLogs = S.get("nl", []);
  ST.aiReports     = S.get("air", []);
  ST.customFoods   = S.get("cf", []);
  ST.dailyLogs     = S.get("dl", []);
  ST.online        = false;
}

function boot() {
  showLoader();

  // Set a 6 second timeout — if Supabase doesn't respond, use cache
  var timer = setTimeout(function() {
    loadFromCache();
    render();
  }, 6000);

  Promise.all([
    sbSelect("workout_logs"),
    sbSelect("body_stats"),
    sbSelect("nutrition_logs"),
    sbSelect("ai_reports"),
    sbSelect("custom_foods"),
    sbSelect("daily_logs")
  ]).then(function(results) {
    clearTimeout(timer);
    var wl = results[0], bs = results[1], nl = results[2], air = results[3], cf = results[4], dl = results[5];

    if(wl !== null) {
      ST.workoutLogs   = wl.map(function(r)  { return {id:r.id, dayId:r.day_id, date:r.date, duration:r.duration, exercises:r.exercises||[]}; });
      ST.bodyStats     = bs.map(function(r)  { return {id:r.id, date:r.date, weight:r.weight, bf:r.bf, waist:r.waist, chest:r.chest, hips:r.hips, r_arm:r.r_arm, l_arm:r.l_arm, r_thigh:r.r_thigh, l_thigh:r.l_thigh, sleep:r.sleep, notes:r.notes, photo_path:r.photo_path||null}; });
      ST.nutritionLogs = nl.map(function(r)  { return {id:r.id, date:r.date, type:r.type, name:r.name, grams:r.grams, cal:r.cal, p:r.p, c:r.c, f:r.f, liters:r.liters}; });
      ST.aiReports     = air.map(function(r) { return {id:r.id, date:r.date, report:r.report, snapshot:r.snapshot}; });
      ST.customFoods   = (cf||[]).map(function(r) { return {id:r.id, n:r.name, cal:r.cal, p:r.p, c:r.c, f:r.f, cat:r.cat||"Custom", serving_label:r.serving_label, serving_grams:r.serving_grams, food_type:r.food_type||"A", source:r.source||"claude"}; });
      ST.dailyLogs     = (dl||[]).map(function(r) { return {id:r.id, date:r.date, steps:r.steps, sleep_hours:r.sleep_hours}; });
      S.set("wl",  ST.workoutLogs);
      S.set("bs",  ST.bodyStats);
      S.set("nl",  ST.nutritionLogs);
      S.set("air", ST.aiReports);
      S.set("cf",  ST.customFoods);
      S.set("dl",  ST.dailyLogs);
      ST.online = true;
    } else {
      loadFromCache();
    }
    render();
  }).catch(function() {
    clearTimeout(timer);
    loadFromCache();
    render();
  });
}

// Global safety net
window.addEventListener("error", function(e) { console.error("App error:", e); });
window.addEventListener("unhandledrejection", function(e) { console.error("Promise error:", e); });

if(document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
